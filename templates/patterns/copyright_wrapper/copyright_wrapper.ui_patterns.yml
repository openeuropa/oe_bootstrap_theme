copyright_wrapper:
  label: 'Copyright wrapper'
  description: 'Wraps content with an optional copyright overlay.'
  category: 'Version 2.x'
  fields:
    content:
      type: render
      label: 'Content'
      description: 'Primary content element (image, video, iframe, etc.).'
      preview: '<img src="https://picsum.photos/900/600" alt="Sample image">'
    copyright:
      type: array
      label: 'Copyright'
      description: 'Optional copyright overlay configuration. Provide the same keys accepted by the copyright_overlay pattern.'
      preview:
        content:
          '#markup': 'Copyright European Union 2024'
  settings:
    tag:
      type: textfield
      label: 'Wrapper tag'
      description: 'HTML tag for the outer wrapper. Defaults to &lt;div&gt;.'
      allow_token: true
    attributes:
      type: attributes
      label: 'Wrapper attributes'
      description: 'Extra attributes for the outer wrapper.'
      allow_token: true
