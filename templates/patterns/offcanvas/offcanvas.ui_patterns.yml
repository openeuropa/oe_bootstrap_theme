offcanvas:
  label: 'Offcanvas'
  description: 'Hidden sidebar with activation. For more information visit: https://getbootstrap.com/docs/5.0/components/offcanvas/'
  variants:
    default:
      label: 'Default'
    search:
      label: 'Search'
  settings:
    placement:
      type: select
      label: 'Offcanvas'
      description: 'Select the placement of the offcanvas:'
      options:
        start: 'start'
        end: 'end'
        top: 'top'
        bottom: 'bottom'
      preview: 'start'
    body_scroll:
      type: boolean
      label: 'Scroll'
      description: 'If true, enable body scrolling when offcanvas is displayed. Defaults to false.'
    backdrop:
      type: boolean
      label: 'Backdrop'
      description: 'If true, enable backdrop behind offcanvas. Defaults to false.'
      preview: true
  fields:
    title:
      type: text
      label: 'Title'
      description: 'Offcanvas title.'
      preview: 'An offcanvas title'
    body:
      type: text
      label: 'Body'
      description: 'Offcanvas body content.'
      preview: |
        <div>
          <p>An interesting content for this offcanvas.</p>
          <div class="d-none d-lg-block">
            <p><em>Resize to a narrower viewport to activate the offcanvas hide/show mechanism.</em></p>
          </div>
          <div class="d-lg-none">
            <p><em>Resize to a wider viewport to deactivate the offcanvas hide/show mechanism.</em></p>
          </div>
        </div>
    toggle:
      type: array
      label: 'Toggle button'
      description: 'An optional button pattern definition that will allow to show/hide the offcanvas.'
      preview:
        label: 'Toggle'
        icon: 'filter'
        attributes:
          class: ['d-lg-none']
