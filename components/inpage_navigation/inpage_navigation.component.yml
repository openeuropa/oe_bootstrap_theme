name: 'Inpage navigation'
description: 'Provides a sticky table of contents alongside page content and updates the active item while scrolling.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the navigation.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'HTML tag used for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: [object, 'null']
      description: 'Optional link applied to the title.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
            - null
        id:
          type: [string, 'null']
        disabled:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            size:
              type: [string, 'null']
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
                - null
            transformation:
              type: [string, 'null']
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
                - null
            attributes:
              type: [object, string, 'null']  # attributes
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
            - null
        icon_display:
          type: [string, 'null']
          enum:
            - flex
            - inline-flex
            - null
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, string, 'null']  # attributes
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    links:
      title: Links
      type: [array, 'null']
      description: 'Links to headings in the page content.'
      items:
        type: [object, 'null']
        properties:
          label:
            type: [string, array, object, 'null']
          path:
            type: [string, object, 'null']
          variant:
            type: [string, 'null']
            enum:
              - primary
              - secondary
              - success
              - danger
              - warning
              - info
              - light
              - dark
              - null
          id:
            type: [string, 'null']
          disabled:
            type: [boolean, 'null']
          standalone:
            type: [boolean, 'null']
          active:
            type: [boolean, 'null']
          icon:
            type: [string, object, 'null']
            properties:
              name:
                type: [string, 'null']
              path:
                type: [string, 'null']
              size:
                type: [string, 'null']
                enum:
                  - 2xs
                  - xs
                  - s
                  - m
                  - l
                  - xl
                  - 2xl
                  - fluid
                  - null
              transformation:
                type: [string, 'null']
                enum:
                  - rotate-90
                  - rotate-180
                  - rotate-270
                  - flip-horizontal
                  - flip-vertical
                  - null
              attributes:
                type: [object, string, 'null']  # attributes
          icon_position:
            type: [string, 'null']
            enum:
              - before
              - after
              - null
          icon_display:
            type: [string, 'null']
            enum:
              - flex
              - inline-flex
              - null
          remove_icon_spacers:
            type: [boolean, 'null']
          attributes:
            type: [object, string, 'null']  # attributes
    content:
      title: Content
      type: [string, array, object, 'null']
      description: 'Page content displayed alongside the navigation.'
    id:
      title: ID
      type: [string, 'null']
      description: 'Navigation ID. A unique ID is generated when omitted.'
    dropdown_id:
      title: 'Dropdown ID'
      type: [string, 'null']
      description: 'Mobile dropdown trigger ID. Defaults to the navigation ID followed by -dropdown.'
    dynamic_active:
      title: 'Dynamic active'
      type: [boolean, 'null']
      description: 'Automatically controls the active item on mobile. Defaults to false.'
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: 'Navigation attributes'
      type: Drupal\Core\Template\Attribute
