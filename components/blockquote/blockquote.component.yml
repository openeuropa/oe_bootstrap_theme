name: 'Blockquote'
description: 'For quoting blocks of content from another source within your document.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object]
      description: 'Title of the blockquote.'
    title_tag:
      title: 'Title tag'
      type: string
      description: 'The tag to use for the title. Defaults to h2.'
    quote:
      title: Quote
      type: [string, array, object]
      description: 'The quote text.'
    attribution:
      title: Attribution
      type: [string, array, object]
      description: 'The name of the quoted person or entity.'
    cite:
      title: Citation
      type: [string, array, object]
      description: 'The creative work in which the referenced quote was published.'
    alignment:
      title: 'Text alignment'
      type: string
      description: 'Aligns the quote in the page.'
      enum:
        - left
        - center
        - end
      'meta:enum':
        left: 'left (default)'
        center: center
        end: end
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
