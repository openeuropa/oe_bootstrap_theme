name: 'Date block'
description: 'Date block allows to present a date that can be placed in other components.'
props:
  type: object
  required:
    - date
  properties:
    date:
      title: Date
      type: DateTimeInterface
      description: 'A DateTime object. This is required.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
