name: Navbar
description: 'Displays a responsive navigation bar with branding, navigation, and right-aligned content regions.'
props:
  type: object
  properties:
    expanded_breakpoint:
      title: 'Expanded breakpoint'
      description: 'Breakpoint at which the navbar is expanded. Defaults to lg.'
      type: [string, 'null']
      enum:
        - sm
        - md
        - lg
        - null
      'meta:enum':
        sm: Small
        md: Medium
        lg: 'Large (default)'
        '': Default
    color_scheme:
      title: 'Color scheme'
      description: 'Color scheme used by the navbar. Defaults to light.'
      type: [string, 'null']
      default: light
      enum:
        - light
        - dark
        - null
      'meta:enum':
        light: 'Light (default)'
        dark: Dark
        '': Default
    background:
      title: Background
      description: 'Adds a background matching the color scheme. Defaults to true.'
      type: [boolean, 'null']
      default: true
    branding:
      title: 'Branding region'
      description: 'Branding content, such as a linked site name or logo.'
      type: [string, array, object, 'null']
    navigation:
      title: 'Navigation region'
      description: 'Primary navigation content.'
      type: [string, array, object, 'null']
    right:
      title: 'Right region'
      description: 'Content aligned to the end of the navbar, such as search or account actions.'
      type: [string, array, object, 'null']
    collapse_id:
      title: 'Collapse ID'
      description: 'ID connecting the responsive toggle and collapsible content. A unique ID is generated when omitted.'
      type: [string, 'null']
    disable_collapse:
      title: 'Disable collapse'
      description: 'Keeps all navbar content visible and removes the responsive toggle. Defaults to true when no expanded breakpoint is provided.'
      type: [boolean, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
