name: Listing
description: 'Listing of cards.'
variants:
  default:
    title: Default
  highlight:
    title: Highlight
slots:
  title:
    title: Title
    description: 'Title of the listing block.'
  title_tag:
    title: 'Title tag'
    description: 'The tag to use for the title. Defaults to h2.'
props:
  type: object
  properties:
    columns:
      title: Columns
      description: 'Number of columns, 1, 2 or 3. Defaults to 1.'
      type: [number, 'null']
    link:
      title: Link
      description: 'Call to action link with icon. A link pattern definition must be passed.'
      type: [array, 'null']
    items:
      title: Items
      description: 'List of card items.'
      type: [array, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
