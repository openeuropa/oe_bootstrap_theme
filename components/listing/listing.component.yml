name: Listing
description: 'Displays cards in default or highlighted one-, two-, or three-column listings.'
props:
  type: object
  properties:
    variant:
      title: Variant
      type: [string, 'null']
      description: 'Visual style of the listing. Defaults to default.'
      enum:
        - default
        - highlight
      'meta:enum':
        default: 'Default (default)'
        highlight: Highlight
    columns:
      title: Columns
      type: [integer, 'null']
      description: 'Number of columns. Defaults to 1.'
      enum:
        - 1
        - 2
        - 3
      'meta:enum':
        1: 'One (default)'
        2: Two
        3: Three
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the listing.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'The tag to use for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: [object, 'null']
      description: 'Optional link applied to the listing title. The title prop is used as its label.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
        id:
          type: [string, 'null']
        disabled:
          type: [boolean, 'null']
        icon:
          type: [object, 'null']
          properties:
            name:
              type: [string, 'null']
            size:
              type: [string, 'null']
            path:
              type: [string, 'null']
            transformation:
              type: [string, 'null']
            attributes:
              type: [object, 'null']
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
        icon_display:
          type: [string, 'null']
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, 'null']
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    items:
      title: Items
      type: [array, 'null']
      description: 'Cards displayed in the listing.'
      items:
        type: [object, 'null']
        properties:
          title:
            type: [string, array, object, 'null']
          title_tag:
            type: [string, 'null']
          title_link:
            type: [object, 'null']
            description: 'Optional link applied to the card title. The title prop is used as its label.'
            properties:
              path:
                type: [string, object, 'null']
              variant:
                type: [string, 'null']
              id:
                type: [string, 'null']
              disabled:
                type: [boolean, 'null']
              icon:
                type: [object, 'null']
                properties:
                  name:
                    type: [string, 'null']
                  size:
                    type: [string, 'null']
                  path:
                    type: [string, 'null']
                  transformation:
                    type: [string, 'null']
                  attributes:
                    type: [object, 'null']
              icon_position:
                type: [string, 'null']
                enum:
                  - before
                  - after
              icon_display:
                type: [string, 'null']
                enum:
                  - flex
                  - inline-flex
              remove_icon_spacers:
                type: [boolean, 'null']
              attributes:
                type: [object, 'null']
          url:
            type: [object, 'null']
            description: 'Drupal URL object optionally applied to the card title.'
          subtitle:
            type: [string, array, object, 'null']
          text:
            type: [string, array, object, 'null']
          image:
            type: [object, 'null']
            properties:
              src:
                type: [string, 'null']
              alt:
                type: [string, 'null']
              position:
                type: [string, 'null']
                enum:
                  - top
                  - bottom
                  - background
              classes:
                type: [string, 'null']
              rounded:
                type: [string, 'null']
          image_copyright:
            type: [string, array, object, 'null']
          image_copyright_label:
            type: [string, 'null']
            description: 'Assistive label displayed before the image copyright. Defaults to "Image credit:".'
          date:
            type: [object, 'null']
            properties:
              day:
                type: [string, integer, 'null']
              month:
                type: [string, 'null']
              date_time:
                type: [string, 'null']
              year:
                type: [string, integer, 'null']
              end_day:
                type: [string, integer, 'null']
              end_month:
                type: [string, 'null']
              end_year:
                type: [string, integer, 'null']
              icon_path:
                type: [string, 'null']
              attributes:
                type: [object, 'null']
          content:
            type: [string, array, object, 'null']
          header:
            type: [string, array, object, 'null']
          footer:
            type: [string, array, object, 'null']
          badges:
            type: [array, 'null']
            items:
              type: [string, object, 'null']
              properties:
                label:
                  type: [string, array, object, 'null']
                background:
                  type: [string, 'null']
                url:
                  type: [string, 'null']
                title:
                  type: [string, 'null']
                dismissible:
                  type: [boolean, 'null']
                assistive_text:
                  type: [string, 'null']
                rounded_pill:
                  type: [boolean, 'null']
                outline:
                  type: [boolean, 'null']
                icon_path:
                  type: [string, 'null']
                attributes:
                  type: [object, 'null']
    link:
      title: Link
      type: [object, 'null']
      description: 'Optional call-to-action link displayed below the cards.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
        id:
          type: [string, 'null']
        disabled:
          type: [boolean, 'null']
        standalone:
          type: [boolean, 'null']
        icon:
          type: [object, 'null']
          properties:
            path:
              type: [string, 'null']
            transformation:
              type: [string, 'null']
            attributes:
              type: [object, 'null']
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
        icon_display:
          type: [string, 'null']
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, 'null']
    alignment:
      title: Alignment
      type: [string, 'null']
      description: 'Vertical alignment of card media and content.'
      enum:
        - start
        - end
        - center
        - baseline
        - stretch
      'meta:enum':
        start: Start
        end: End
        center: Center
        baseline: Baseline
        stretch: Stretch
    image_size:
      title: 'Image size'
      type: [string, 'null']
      description: 'Width of card media in horizontal listings.'
      enum:
        - small
        - large
        - extra-large
      'meta:enum':
        small: Small
        large: Large
        extra-large: 'Extra large'
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the icons SVG file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
