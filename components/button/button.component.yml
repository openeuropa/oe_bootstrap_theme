name: Button
description: 'For actions in forms, dialogs, and more with support for multiple sizes, states, and icons.'
variants:
  primary:
    title: 'Primary (default)'
  secondary:
    title: Secondary
  success:
    title: Success
  danger:
    title: Danger
  warning:
    title: Warning
  info:
    title: Info
  light:
    title: Light
  dark:
    title: Dark
  link:
    title: Link
props:
  type: object
  properties:
    outline:
      title: Outline
      description: 'Lighter button style removing background color. Defaults to false.'
      type: [boolean, 'null']
    size:
      title: Size
      description: 'Size of the button. Defaults to md.'
      type: [string, 'null']
      enum:
        - sm
        - md
        - lg
        - null
      'meta:enum':
        sm: Small
        md: 'Medium (default)'
        lg: Large
        '': Default
    type:
      title: Type
      description: 'Sets the button behavior type. Defaults to button.'
      type: [string, 'null']
      enum:
        - button
        - submit
        - reset
        - null
      'meta:enum':
        button: 'Button (default)'
        submit: Submit
        reset: Reset
        '': Default
    disabled:
      title: Disabled
      description: 'If true, the button will not be enabled when clicking. Defaults to false.'
      type: [boolean, 'null']
    icon_position:
      title: 'Icon position'
      description: 'If button has an icon, it can be placed before or after text. Defaults to after.'
      type: [string, 'null']
      enum:
        - before
        - after
        - null
      'meta:enum':
        before: Before
        after: 'After (default)'
        '': Default
    label:
      title: Label
      description: 'The button label.'
      type: [string, array, object, 'null']
    icon:
      title: Icon
      description: 'Icon name as a string or an icon object.'
      type: [string, object, 'null']
    text_nowrap:
      title: 'No text wrap'
      description: 'Prevents the button label from wrapping.'
      type: [boolean, 'null']
    assistive_text:
      title: 'Assistive text'
      description: 'Visually hidden text printed before the button label.'
      type: [string, 'null']
    id:
      title: ID
      description: 'Button ID attribute.'
      type: [string, 'null']
    icon_spacing:
      title: 'Icon spacing'
      description: 'Spacing between icon and label.'
      type: [string, 'null']
      enum:
        - sm
        - md
        - lg
        - null
      'meta:enum':
        sm: Small
        md: Medium
        lg: Large
        '': Default
    spinner:
      title: Spinner
      description: 'Spinner object.'
      type: [object, 'null']
    show_spinner:
      title: 'Show spinner'
      description: 'Displays the spinner before the button label.'
      type: [boolean, 'null']
    clean_class:
      title: 'Clean class'
      description: 'If true, BCL button classes are not added.'
      type: [boolean, 'null']
    remove_icon_spacers:
      title: 'Remove icon spacers'
      description: 'Removes the default spacing between icon and label.'
      type: [boolean, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
