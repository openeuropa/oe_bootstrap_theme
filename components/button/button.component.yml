name: Button
description: 'For actions in forms, dialogs, and more with support for multiple sizes, states, and more. For more information: https://v5.getbootstrap.com/docs/5.0/components/buttons/'
variants:
  primary:
    title: 'Primary (default)'
  secondary:
    title: Secondary
  success:
    title: Success
  danger:
    title: Danger
  warning:
    title: Warning
  info:
    title: Info
  light:
    title: Light
  dark:
    title: Dark
  link:
    title: Link
props:
  type: object
  properties:
    outline:
      title: 'Button outline'
      description: 'Lighter button style removing background color. Defaults to false.'
      type: [boolean, 'null']
    size:
      title: 'Button size'
      description: 'Size of the button:'
      type: [string, 'null']
      enum:
        - sm
        - md
        - lg
        - null
      'meta:enum':
        sm: Small
        md: 'Medium (default)'
        lg: Large
        '': Default
    type:
      title: 'Button type'
      description: 'Sets the button behavior type:'
      type: [string, 'null']
      enum:
        - button
        - submit
        - reset
        - null
      'meta:enum':
        button: 'Button (default)'
        submit: Submit
        reset: Reset
        '': Default
    disabled:
      title: Disabled
      description: 'If true, the button will not be enabled when clicking. Defaults to false.'
      type: [boolean, 'null']
    icon_position:
      title: 'Icon position'
      description: 'If button has an icon, it can be placed before or after text:'
      type: [string, 'null']
      enum:
        - before
        - after
        - null
      'meta:enum':
        before: Before
        after: 'After (default)'
        '': Default
    label:
      title: 'Button label'
      description: 'The button label.'
      type: [string, array, object, 'null']
    icon:
      title: 'Icon name'
      description: 'Adds an icon to the button. Optional.'
      type: [object, string, 'null']
    attributes:
      title: Attributes
      type: [object, array, string, 'null']
