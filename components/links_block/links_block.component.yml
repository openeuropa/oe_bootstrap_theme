name: 'Links block'
description: 'Displays a list of links with an optional title.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object]
      description: 'Title of the links block.'
    title_tag:
      title: 'Title tag'
      type: string
      description: 'HTML tag used for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: object
      description: 'Optional link applied to the title.'
      properties:
        label:
          type: [string, array, object]
        path:
          type: [string, object]
        variant:
          type: string
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
        id:
          type: string
        disabled:
          type: boolean
        icon:
          type: [string, object]
          properties:
            name:
              type: string
            path:
              type: string
            size:
              type: string
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
            transformation:
              type: string
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
            attributes:
              type: object
        icon_position:
          type: string
          enum:
            - before
            - after
        icon_display:
          type: string
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: boolean
        attributes:
          type: object
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    background:
      title: Background
      type: string
      description: 'Background style of the block. Defaults to gray.'
      default: gray
      enum:
        - gray
        - transparent
      'meta:enum':
        gray: 'Gray (default)'
        transparent: Transparent
    orientation:
      title: Orientation
      type: string
      description: 'Direction in which links are displayed. Defaults to vertical.'
      default: vertical
      enum:
        - vertical
        - horizontal
      'meta:enum':
        vertical: 'Vertical (default)'
        horizontal: Horizontal
    links:
      title: Links
      type: array
      description: 'Links displayed in the block.'
      items:
        type: object
        properties:
          label:
            type: [string, array, object]
          path:
            type: [string, object]
          variant:
            type: string
            enum:
              - primary
              - secondary
              - success
              - danger
              - warning
              - info
              - light
              - dark
          id:
            type: string
          disabled:
            type: boolean
          icon:
            type: [string, object]
            properties:
              name:
                type: string
              path:
                type: string
              size:
                type: string
                enum:
                  - 2xs
                  - xs
                  - s
                  - m
                  - l
                  - xl
                  - 2xl
                  - fluid
              transformation:
                type: string
                enum:
                  - rotate-90
                  - rotate-180
                  - rotate-270
                  - flip-horizontal
                  - flip-vertical
              attributes:
                type: object
          icon_position:
            type: string
            enum:
              - before
              - after
          icon_display:
            type: string
            enum:
              - flex
              - inline-flex
          remove_icon_spacers:
            type: boolean
          attributes:
            type: object
    icon_path:
      title: 'Icons path'
      type: string
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
