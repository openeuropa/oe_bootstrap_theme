name: 'Links block'
description: 'Displays a list of links with an optional title.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the links block.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'HTML tag used for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: [object, 'null']
      description: 'Optional link applied to the title.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
            - null
        id:
          type: [string, 'null']
        disabled:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            size:
              type: [string, 'null']
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
                - null
            transformation:
              type: [string, 'null']
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
                - null
            attributes:
              type: [object, 'null']
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
            - null
        icon_display:
          type: [string, 'null']
          enum:
            - flex
            - inline-flex
            - null
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, 'null']
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    background:
      title: Background
      type: [string, 'null']
      description: 'Background style of the block. Defaults to gray.'
      default: gray
      enum:
        - gray
        - transparent
        - null
      'meta:enum':
        gray: 'Gray (default)'
        transparent: Transparent
    orientation:
      title: Orientation
      type: [string, 'null']
      description: 'Direction in which links are displayed. Defaults to vertical.'
      default: vertical
      enum:
        - vertical
        - horizontal
        - null
      'meta:enum':
        vertical: 'Vertical (default)'
        horizontal: Horizontal
    links:
      title: Links
      type: [array, 'null']
      description: 'Links displayed in the block.'
      items:
        type: [object, 'null']
        properties:
          label:
            type: [string, array, object, 'null']
          path:
            type: [string, object, 'null']
          variant:
            type: [string, 'null']
            enum:
              - primary
              - secondary
              - success
              - danger
              - warning
              - info
              - light
              - dark
              - null
          id:
            type: [string, 'null']
          disabled:
            type: [boolean, 'null']
          icon:
            type: [string, object, 'null']
            properties:
              name:
                type: [string, 'null']
              path:
                type: [string, 'null']
              size:
                type: [string, 'null']
                enum:
                  - 2xs
                  - xs
                  - s
                  - m
                  - l
                  - xl
                  - 2xl
                  - fluid
                  - null
              transformation:
                type: [string, 'null']
                enum:
                  - rotate-90
                  - rotate-180
                  - rotate-270
                  - flip-horizontal
                  - flip-vertical
                  - null
              attributes:
                type: [object, 'null']
          icon_position:
            type: [string, 'null']
            enum:
              - before
              - after
              - null
          icon_display:
            type: [string, 'null']
            enum:
              - flex
              - inline-flex
              - null
          remove_icon_spacers:
            type: [boolean, 'null']
          attributes:
            type: [object, 'null']
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
