name: 'Links block'
description: 'List of links with an optional title.'
slots:
  title:
    title: Title
    description: 'Title of the links block.'
  title_tag:
    title: 'Title tag'
    description: 'The tag to use for the title. Defaults to h2.'
props:
  type: object
  properties:
    background:
      title: Background
      description: 'Determines the background of the block:'
      type: [string, 'null']
      enum:
        - gray
        - transparent
      'meta:enum':
        gray: 'gray (default)'
        transparent: transparent
    orientation:
      title: Orientation
      description: 'Determines if the list of links is shown vertically or horizontally:'
      type: [string, 'null']
      enum:
        - vertical
        - horizontal
      'meta:enum':
        vertical: 'vertical (default)'
        horizontal: horizontal
    links:
      title: Links
      description: 'Array of links.'
      type: [array, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
