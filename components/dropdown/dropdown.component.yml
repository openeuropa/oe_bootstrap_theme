name: Dropdown
description: 'Toggle contextual overlays for displaying lists of links and actions.'
props:
  type: object
  properties:
    button_label:
      title: 'Dropdown button label'
      type: [string, array, object, 'null']
      description: 'Label used by the default dropdown toggle.'
    dropdown_id:
      title: 'Dropdown ID'
      type: [string, 'null']
      description: 'ID connecting the toggle and menu. A unique ID is generated when omitted.'
    trigger:
      title: Trigger
      type: [object, 'null']
      description: 'Optional BCL button or link configuration for the dropdown toggle.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
        size:
          type: [string, 'null']
        type:
          type: [string, 'null']
        outline:
          type: [boolean, 'null']
        disabled:
          type: [boolean, 'null']
        assistive_text:
          type: [string, 'null']
        standalone:
          type: [boolean, 'null']
        icon:
          anyOf:
            - type: string
            - type: object
              properties:
                name:
                  type: [string, 'null']
                path:
                  type: [string, 'null']
                transformation:
                  type: [string, 'null']
                attributes:
                  type: [object, 'null']
        icon_position:
          type: [string, 'null']
        attributes:
          type: [object, 'null']
    link:
      title: 'Link trigger'
      type: [boolean, 'null']
      description: 'Render the dropdown toggle as a link instead of a button.'
    direction:
      title: Direction
      type: [string, 'null']
      description: 'Direction in which the menu opens.'
      enum:
        - dropup
        - dropend
        - dropstart
        - null
      'meta:enum':
        dropup: Up
        dropend: End
        dropstart: Start
    alignment:
      title: Alignment
      type: [string, 'null']
      description: 'Dropdown menu alignment.'
      enum:
        - dropdown-menu-end
        - dropdown-menu-sm-end
        - dropdown-menu-md-end
        - dropdown-menu-lg-end
        - dropdown-menu-xl-end
        - dropdown-menu-xxl-end
        - dropdown-menu-start
        - dropdown-menu-sm-start
        - dropdown-menu-md-start
        - dropdown-menu-lg-start
        - dropdown-menu-xl-start
        - dropdown-menu-xxl-start
        - null
      'meta:enum':
        dropdown-menu-end: End
        dropdown-menu-sm-end: 'End from sm'
        dropdown-menu-md-end: 'End from md'
        dropdown-menu-lg-end: 'End from lg'
        dropdown-menu-xl-end: 'End from xl'
        dropdown-menu-xxl-end: 'End from xxl'
        dropdown-menu-start: Start
        dropdown-menu-sm-start: 'Start from sm'
        dropdown-menu-md-start: 'Start from md'
        dropdown-menu-lg-start: 'Start from lg'
        dropdown-menu-xl-start: 'Start from xl'
        dropdown-menu-xxl-start: 'Start from xxl'
    dark_mode:
      title: 'Dark mode'
      type: [boolean, 'null']
      description: 'Use the dark dropdown menu style.'
    remove_wrapper:
      title: 'Remove wrapper'
      type: [boolean, 'null']
      description: 'Do not render the dropdown wrapper element.'
    inside_navigation:
      title: 'Inside navigation'
      type: [boolean, 'null']
      description: 'Render menu accessibility attributes for use inside navigation.'
    items:
      title: 'Dropdown items'
      type: [array, 'null']
      description: 'Links, buttons, and dividers displayed in the menu.'
      items:
        type: [object, 'null']
        properties:
          label:
            type: [string, array, object, 'null']
          path:
            type: [string, object, 'null']
          button:
            type: [boolean, 'null']
          divider:
            type: [boolean, 'null']
          active:
            type: [boolean, 'null']
          disabled:
            type: [boolean, 'null']
          id:
            type: [string, 'null']
          title:
            type: [string, 'null']
          type:
            type: [string, 'null']
          variant:
            type: [string, 'null']
          size:
            type: [string, 'null']
          outline:
            type: [boolean, 'null']
          standalone:
            type: [boolean, 'null']
          icon:
            anyOf:
              - type: string
              - type: object
                properties:
                  name:
                    type: [string, 'null']
                  path:
                    type: [string, 'null']
                  transformation:
                    type: [string, 'null']
                  attributes:
                    type: [object, 'null']
          icon_position:
            type: [string, 'null']
          attributes:
            type: [object, 'null']
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
