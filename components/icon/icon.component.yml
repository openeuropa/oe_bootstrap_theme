name: Icon
description: 'Displays an icon from an SVG sprite.'
props:
  type: object
  properties:
    name:
      title: Name
      description: 'Name of the icon in the SVG sprite.'
      type: [string, 'null']
    size:
      title: Size
      description: 'Size of the icon. Defaults to s.'
      type: [string, 'null']
      enum:
        - 2xs
        - xs
        - s
        - m
        - l
        - xl
        - 2xl
        - fluid
        - null
      'meta:enum':
        2xs: 2XS
        xs: XS
        s: 'S (default)'
        m: M
        l: L
        xl: XL
        2xl: 2XL
        fluid: Fluid
        '': Default
    transformation:
      title: Transformation
      description: 'Optional rotation or flip transformation.'
      type: [string, 'null']
      enum:
        - rotate-90
        - rotate-180
        - rotate-270
        - flip-horizontal
        - flip-vertical
        - null
      'meta:enum':
        rotate-90: 'Rotate 90 degrees'
        rotate-180: 'Rotate 180 degrees'
        rotate-270: 'Rotate 270 degrees'
        flip-horizontal: 'Flip horizontally'
        flip-vertical: 'Flip vertically'
        '': Default
    icon_path:
      title: 'Icon path'
      description: 'Path to the SVG sprite. Defaults to the BCL icon path.'
      type: [string, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
