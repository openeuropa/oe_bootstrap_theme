name: Icon
description: 'A component to show an icon. For more information visit: https://icons.getbootstrap.com/.'
props:
  type: object
  properties:
    name:
      title: 'Name of icon'
      description: 'A list of icon names (Empty by default). It can be a set or a subset of icon names that are present in the svg file:'
      type: [string, 'null']
      enum:
        - award
        - box-arrow-up
        - check
        - envelope
        - eye
        - hand-index
      'meta:enum':
        award: award
        box-arrow-up: box-arrow-up
        check: check
        envelope: envelope
        eye: eye
        hand-index: info
    size:
      title: 'Size of icon'
      description: 'A list of icon sizes.'
      type: [string, 'null']
      enum:
        - 2xs
        - xs
        - s
        - m
        - l
        - xl
        - 2xl
        - fluid
      'meta:enum':
        2xs: 2xs
        xs: xs
        s: 's (default)'
        m: m
        l: l
        xl: xl
        2xl: 2xl
        fluid: fluid
