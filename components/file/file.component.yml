name: File
description: 'Presents a file available for download, optionally with translations.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title displayed above the file.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'Tag used for the title. Defaults to h2.'
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    link_label:
      title: 'Download link label'
      type: [string, 'null']
      description: 'Label used for the download links. Defaults to Download.'
    file:
      title: File
      type: [object, 'null']
      description: 'File presented for download.'
      properties:
        title:
          type: [string, 'null']
        url:
          type: [string, 'null']
        size:
          type: [string, integer, 'null']
        extension:
          type: [string, 'null']
        language_code:
          type: [string, 'null']
        meta:
          type: [string, 'null']
    translations:
      title: Translations
      type: [array, 'null']
      description: 'List of translations of the file.'
      items:
        type: [object, 'null']
        properties:
          title:
            type: [string, 'null']
          url:
            type: [string, 'null']
          size:
            type: [string, integer, 'null']
          extension:
            type: [string, 'null']
          language_code:
            type: [string, 'null']
          meta:
            type: [string, 'null']
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
