name: Navigation
description: 'Renders a series of links in a navigation element.'
variants:
  default:
    title: Default
    description: 'Default navigation style.'
  tabs:
    title: Tabs
    description: 'Shows the items styled as tabs.'
  pills:
    title: Pills
    description: 'Shows the items styled as pills.'
  navbar:
    title: Navbar
    description: 'When the navigation is part of a navbar element.'
props:
  type: object
  properties:
    orientation:
      title: Orientation
      description: 'Can be set to horizontal or vertical. Defaults to horizontal.'
      type: string
    items:
      title: 'Navigation items'
      description: 'Array of navigation items'
      type: array
