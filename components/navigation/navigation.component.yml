name: Navigation
description: 'Renders links, buttons, dropdowns, and nested navigation in several Bootstrap navigation styles.'
props:
  type: object
  properties:
    variant:
      title: Variant
      type: [string, 'null']
      description: 'Navigation presentation. Defaults to default.'
      default: default
      enum:
        - default
        - tabs
        - pills
        - navbar
      'meta:enum':
        default: Default
        tabs: Tabs
        pills: Pills
        navbar: Navbar
    orientation:
      title: Orientation
      type: [string, 'null']
      description: 'Navigation orientation. Defaults to horizontal.'
      enum:
        - horizontal
        - vertical
      'meta:enum':
        horizontal: Horizontal
        vertical: Vertical
    navigation_id:
      title: 'Navigation ID'
      type: [string, 'null']
      description: 'ID added to the navigation wrapper.'
    full_width:
      title: 'Full width'
      type: [boolean, 'null']
      description: 'Distribute items across the available width.'
    alignment:
      title: Alignment
      type: [string, 'null']
      description: 'Horizontal alignment of navigation items.'
      enum:
        - start
        - center
        - end
      'meta:enum':
        start: Start
        center: Center
        end: End
    tabs_content:
      title: 'Tab content'
      type: [boolean, 'null']
      description: 'Render tab panels from each item content value.'
    items:
      title: 'Navigation items'
      type: [array, 'null']
      description: 'Links, buttons, dropdowns, and nested navigation items.'
      items:
        type: [object, 'null']
        properties:
          label:
            type: [string, array, object, 'null']
          path:
            type: [string, object, 'null']
          id:
            type: [string, 'null']
          title:
            type: [string, 'null']
          variant:
            type: [string, 'null']
          active:
            type: [boolean, 'null']
          disabled:
            type: [boolean, 'null']
          standalone:
            type: [boolean, 'null']
          button:
            type: [boolean, 'null']
          type:
            type: [string, 'null']
          text_nowrap:
            type: [boolean, 'null']
          assistive_text:
            type: [string, 'null']
          icon:
            anyOf:
              - type: string
              - type: object
                properties:
                  name:
                    type: [string, 'null']
                  path:
                    type: [string, 'null']
                  transformation:
                    type: [string, 'null']
                  attributes:
                    type: [object, 'null']
          icon_position:
            type: [string, 'null']
            enum:
              - before
              - after
          icon_display:
            type: [string, 'null']
            enum:
              - flex
              - inline-flex
          icon_spacing:
            type: [string, 'null']
          remove_icon_spacers:
            type: [boolean, 'null']
          spinner:
            type: [object, 'null']
            properties:
              type:
                type: [string, 'null']
              variant:
                type: [string, 'null']
              size:
                type: [string, 'null']
              assistive_text:
                type: [string, 'null']
              attributes:
                type: [object, 'null']
          show_spinner:
            type: [boolean, 'null']
          content:
            type: [string, array, object, 'null']
          target:
            type: [string, 'null']
          dropdown:
            type: [boolean, 'null']
          link:
            type: [boolean, 'null']
          alignment:
            type: [string, 'null']
          dark_mode:
            type: [boolean, 'null']
          trigger:
            type: [object, 'null']
            properties:
              label:
                type: [string, array, object, 'null']
              path:
                type: [string, object, 'null']
              variant:
                type: [string, 'null']
              size:
                type: [string, 'null']
              type:
                type: [string, 'null']
              outline:
                type: [boolean, 'null']
              disabled:
                type: [boolean, 'null']
              assistive_text:
                type: [string, 'null']
              standalone:
                type: [boolean, 'null']
              icon:
                anyOf:
                  - type: string
                  - type: object
                    properties:
                      name:
                        type: [string, 'null']
                      path:
                        type: [string, 'null']
                      transformation:
                        type: [string, 'null']
                      attributes:
                        type: [object, 'null']
              icon_position:
                type: [string, 'null']
              attributes:
                type: [object, 'null']
          items:
            type: [array, 'null']
            description: 'Items displayed in a dropdown navigation item.'
            items:
              type: [object, 'null']
              properties:
                label:
                  type: [string, array, object, 'null']
                path:
                  type: [string, object, 'null']
                button:
                  type: [boolean, 'null']
                divider:
                  type: [boolean, 'null']
                active:
                  type: [boolean, 'null']
                disabled:
                  type: [boolean, 'null']
                id:
                  type: [string, 'null']
                title:
                  type: [string, 'null']
                type:
                  type: [string, 'null']
                variant:
                  type: [string, 'null']
                size:
                  type: [string, 'null']
                outline:
                  type: [boolean, 'null']
                standalone:
                  type: [boolean, 'null']
                icon:
                  anyOf:
                    - type: string
                    - type: object
                      properties:
                        name:
                          type: [string, 'null']
                        path:
                          type: [string, 'null']
                        transformation:
                          type: [string, 'null']
                        attributes:
                          type: [object, 'null']
                icon_position:
                  type: [string, 'null']
                attributes:
                  type: [object, 'null']
          navigation:
            type: [object, 'null']
            description: 'Nested BCL navigation configuration.'
            properties:
              id:
                type: [string, 'null']
              variant:
                type: [string, 'null']
                enum:
                  - default
                  - tabs
                  - pills
                  - navbar
              orientation:
                type: [string, 'null']
                enum:
                  - horizontal
                  - vertical
              tabs_content:
                type: [boolean, 'null']
              full_width:
                type: [boolean, 'null']
              alignment:
                type: [string, 'null']
              attributes:
                type: [object, 'null']
              items:
                type: [array, 'null']
                items:
                  type: [object, 'null']
                  properties:
                    label:
                      type: [string, array, object, 'null']
                    path:
                      type: [string, object, 'null']
                    id:
                      type: [string, 'null']
                    active:
                      type: [boolean, 'null']
                    disabled:
                      type: [boolean, 'null']
                    button:
                      type: [boolean, 'null']
                    icon:
                      anyOf:
                        - type: string
                        - type: object
                          properties:
                            name:
                              type: [string, 'null']
                            path:
                              type: [string, 'null']
                            transformation:
                              type: [string, 'null']
                            attributes:
                              type: [object, 'null']
                    icon_position:
                      type: [string, 'null']
                    attributes:
                      type: [object, 'null']
          attributes:
            type: [object, 'null']
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
