name: Navigation
description: 'Renders links, buttons, dropdowns, and nested navigation in several Bootstrap navigation styles.'
variants:
  default:
    title: Default
    description: 'Default navigation style.'
  tabs:
    title: Tabs
    description: 'Shows the items styled as tabs.'
  pills:
    title: Pills
    description: 'Shows the items styled as pills.'
  navbar:
    title: Navbar
    description: 'When the navigation is part of a navbar element.'
props:
  type: object
  properties:
    orientation:
      title: Orientation
      type: [string, 'null']
      description: 'Navigation orientation. Defaults to horizontal.'
      enum:
        - horizontal
        - vertical
        - null
      'meta:enum':
        horizontal: Horizontal
        vertical: Vertical
        '': Default
    navigation_id:
      title: 'Navigation ID'
      type: [string, 'null']
      description: 'ID added to the navigation wrapper.'
    full_width:
      title: 'Full width'
      type: [boolean, 'null']
      description: 'Distribute items across the available width.'
    alignment:
      title: Alignment
      type: [string, 'null']
      description: 'Horizontal alignment of navigation items.'
      enum:
        - start
        - center
        - end
        - null
      'meta:enum':
        start: Start
        center: Center
        end: End
        '': Default
    tabs_content:
      title: 'Tab content'
      type: [boolean, 'null']
      description: 'Render tab panels from each item content value.'
    items:
      title: 'Navigation items'
      type: [array, 'null']
      description: 'Links, buttons, dropdowns, and nested navigation items.'
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
