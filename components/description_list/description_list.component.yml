name: 'Description list'
description: 'Description lists are used to display and organise content that belongs to a category with a descriptions. Common use cases include glossary type lists or a list of speakers with their biographies.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object]
      description: 'Title of the description list.'
    title_tag:
      title: 'Title tag'
      type: string
      description: 'The tag to use for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: object
      description: 'Link applied to the title.'
      properties:
        label:
          type: [string, array, object]
        path:
          type: [string, object]
        variant:
          type: string
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
        id:
          type: string
        disabled:
          type: boolean
        icon:
          type: [string, object]
          properties:
            name:
              type: string
            path:
              type: string
            transformation:
              type: string
            attributes:
              type: object
        icon_position:
          type: string
          enum:
            - before
            - after
        icon_display:
          type: string
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: boolean
        attributes:
          type: object
    items:
      title: 'List items'
      type: array
      description: 'Each item is composed by one or more terms and one or more definitions. Each term entry can have an icon.'
      items:
        type: object
        properties:
          term:
            title: 'Terms'
            description: 'A string or an array of term objects.'
            anyOf:
              - type: string
              - type: array
                items:
                  type: object
                  properties:
                    label:
                      title: Label
                      type: [string, array, object]
                      description: 'Label text or render array.'
                    icon:
                      type: object
                      properties:
                        name:
                          type: string
                        size:
                          type: string
                        path:
                          type: string
          definition:
            title: 'Definition'
            description: 'A string or an array of definition objects.'
            anyOf:
              - type: string
              - type: array
                items:
                  type: object
                  properties:
                    label:
                      type: [string, array, object]
    icon_path:
      type: string
      title: "Icons path"
      description: "Path to icons"
    orientation:
      title: Orientation
      type: string
      description: 'Orientation of the list.'
      enum:
        - default
        - horizontal
      'meta:enum':
        default: Default
        horizontal: Horizontal
    bordered:
      title: Bordered
      type: boolean
      description: 'Adds a border to the description list.'
    col_classes:
      title: 'Column classes'
      type: string
      description: 'Classes for the columns.'
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
