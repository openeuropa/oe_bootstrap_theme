name: Carousel
description: 'A slideshow component for cycling through elements, like images or slides of text.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object]
      description: 'Title of the carousel.'
    title_tag:
      title: 'Title tag'
      type: string
      description: 'The tag to use for the title. Defaults to h2.'
    carousel_id:
      title: 'Carousel ID'
      type: string
      description: 'Unique ID used to connect carousel controls and indicators.'
    slides:
      title: Slides
      type: array
      description: 'Slides shown in the carousel.'
      items:
        type: object
        properties:
          image:
            title: Image
            type: object
            description: 'Image attributes used to build the slide image.'
            properties:
              src:
                type: string
              alt:
                type: string
              title:
                type: string
              loading:
                type: string
              width:
                type: string
              height:
                type: string
              class:
                type: [string, array, object]
          caption_title:
            title: 'Caption title'
            type: [string, array, object]
          caption:
            title: Caption
            type: [string, array, object]
          caption_classes:
            title: 'Caption classes'
            type: string
          interval:
            title: Interval
            type: integer
          copyright:
            title: Copyright
            type: [string, array, object]
          link:
            title: Link
            type: object
            properties:
              label:
                type: [string, array, object]
              path:
                type: string
              icon_position:
                type: string
              icon:
                type: object
                properties:
                  name:
                    type: string
                  size:
                    type: string
                  path:
                    type: string
              attributes:
                type: object
    icon_path:
      title: 'Icons path'
      type: string
      description: 'Path to icons.'
    active_item:
      title: 'Active item'
      type: integer
      description: 'The 1-based index of the active slide. Defaults to 1.'
    fade:
      title: Fade
      type: boolean
      description: 'Animate slides with a fade transition.'
    show_controls:
      title: 'Show controls'
      type: boolean
      description: 'Show previous and next controls. Defaults to true.'
    show_indicators:
      title: 'Show indicators'
      type: boolean
      description: 'Show slide indicators. Defaults to false.'
    autoplay:
      title: Autoplay
      type: boolean
      description: 'Whether to initialise and animate the carousel at page load. Defaults to true.'
    disable_touch:
      title: 'Disable touch'
      type: boolean
      description: 'Disable touch swiping.'
    dark_mode:
      title: 'Dark mode'
      type: boolean
      description: 'Use dark carousel controls and indicators.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
