name: Carousel
description: 'A slideshow component for cycling through elements, like images or slides of text.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the carousel.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'The tag to use for the title. Defaults to h2.'
    carousel_id:
      title: 'Carousel ID'
      type: [string, 'null']
      description: 'Unique ID used to connect carousel controls and indicators.'
    slides:
      title: Slides
      type: [array, 'null']
      description: 'Slides shown in the carousel.'
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to icons.'
    active_item:
      title: 'Active item'
      type: [string, integer, 'null']
      description: 'The 1-based index of the active slide. Defaults to 1.'
    fade:
      title: Fade
      type: [boolean, 'null']
      description: 'Animate slides with a fade transition.'
    show_controls:
      title: 'Show controls'
      type: [boolean, 'null']
      description: 'Show previous and next controls. Defaults to true.'
    show_indicators:
      title: 'Show indicators'
      type: [boolean, 'null']
      description: 'Show slide indicators. Defaults to false.'
    autoplay:
      title: Autoplay
      type: [boolean, 'null']
      description: 'Whether to initialise and animate the carousel at page load. Defaults to true.'
    disable_touch:
      title: 'Disable touch'
      type: [boolean, 'null']
      description: 'Disable touch swiping.'
    dark_mode:
      title: 'Dark mode'
      type: [boolean, 'null']
      description: 'Use dark carousel controls and indicators.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
