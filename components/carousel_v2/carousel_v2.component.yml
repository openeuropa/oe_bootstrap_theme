name: 'Carousel V2'
description: 'A slideshow with shared navigation controls and two layouts: Carousel image ("split") or Carousel hero ("full_width").'
props:
  type: object
  properties:
    carousel_id:
      title: 'Carousel ID'
      type: string
      description: 'Unique ID for the carousel. Generated automatically when omitted.'
    label:
      title: Label
      type: [string, array, object]
      description: 'Accessible name for the carousel region. Defaults to "Featured content".'
    layout:
      title: Layout
      type: string
      description: 'Carousel image fades between slides with content beside the image on desktop. Carousel hero slides between full-width images with overlaid desktop content. Both stack on mobile. Defaults to split.'
      enum:
        - split
        - full_width
      'meta:enum':
        split: 'Carousel image'
        full_width: 'Carousel hero'
    full_bleed:
      title: 'Span page width'
      type: boolean
      default: false
      description: 'Span the page width from inside a centered .container. Works with either layout. Defaults to false.'
    title_tag:
      title: 'Heading level'
      type: string
      description: 'Choose the heading level to match the page hierarchy (for example h4 under h3). Defaults to p. The visual title style stays h1-sized.'
      default: p
      enum:
        - p
        - h2
        - h3
        - h4
        - h5
        - h6
      'meta:enum':
        p: 'Paragraph (default)'
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
        h5: 'Heading 5'
        h6: 'Heading 6'
    active_item:
      title: 'Active item'
      type: integer
      description: 'The 1-based index of the initial slide. Defaults to 1.'
    autoplay:
      title: Autoplay
      type: boolean
      default: true
      description: 'Whether to rotate slides automatically. Defaults to true. Reduced motion always starts paused. Hover and focus do not pause rotation.'
    interval:
      title: Interval
      type: integer
      default: 10000
      minimum: 8000
      description: 'Rotation interval in milliseconds. Defaults to 10000, minimum 8000. BCL extends slides to at least 3000 + 400 per word. Pause preserves remaining time and the visible progress bar.'
    disable_touch:
      title: 'Disable touch'
      type: boolean
      description: 'Disable touch swiping.'
    items:
      title: Slides
      type: array
      description: 'Slides shown in the carousel.'
      items:
        type: object
        properties:
          image:
            title: Image
            type: [string, array, object]
            description: 'Rendered image or picture markup, or an object containing image attributes.'
            properties:
              src:
                type: string
              alt:
                type: string
              title:
                type: string
              loading:
                type: string
              width:
                type: string
              height:
                type: string
              class:
                type: [string, array, object]
          caption_title:
            title: 'Caption title'
            type: [string, array, object]
          caption:
            title: Caption
            type: [string, array, object]
          interval:
            title: Interval
            type: integer
            minimum: 8000
            description: 'Per-slide rotation interval in milliseconds, overriding the default interval. Minimum 8000; longer text can extend it using the reading-time rule.'
          copyright:
            title: Copyright
            type: [string, array, object]
          copyright_label:
            title: 'Copyright label'
            type: [string, array, object]
          link:
            title: Link
            type: object
            properties:
              label:
                type: [string, array, object]
              path:
                type: string
              icon_position:
                type: string
              icon:
                type: object
                properties:
                  name:
                    type: string
                  size:
                    type: string
                  path:
                    type: string
              attributes:
                type: object
    prev_label:
      title: 'Previous label'
      type: [string, array, object]
      description: 'Translated label for the previous slide control. Defaults to "Previous slide".'
    next_label:
      title: 'Next label'
      type: [string, array, object]
      description: 'Translated label for the next slide control. Defaults to "Next slide".'
    play_label:
      title: 'Play label'
      type: [string, array, object]
      description: 'Translated label for the rotation control when paused. Defaults to "Play slides".'
    pause_label:
      title: 'Pause label'
      type: [string, array, object]
      description: 'Translated label for the rotation control when rotating. Defaults to "Pause slides".'
    slide_label:
      title: 'Slide label'
      type: [string, array, object]
      description: 'Translated position in the accessible slide name, using %current% and %total% placeholders. Appended to the slide title when present. Defaults to "%current% of %total%".'
    carousel_role_label:
      title: 'Carousel role label'
      type: [string, array, object]
      description: 'Translated ARIA role description announced for the carousel region. Defaults to "carousel".'
    slide_role_label:
      title: 'Slide role label'
      type: [string, array, object]
      description: 'Translated ARIA role description announced for each slide. Defaults to "slide".'
    icon_path:
      title: 'Icons path'
      type: string
      description: 'Path to icons.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
