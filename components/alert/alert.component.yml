name: Alert
description: 'Provide contextual feedback messages for typical user actions with the handful of available and flexible alert messages. https://v5.getbootstrap.com/docs/5.0/components/alerts/'
variants:
  primary:
    title: 'Primary (default)'
  secondary:
    title: Secondary
  success:
    title: Success
  danger:
    title: Danger
  warning:
    title: Warning
  info:
    title: Info
  light:
    title: Light
  dark:
    title: Dark
  link:
    title: Link
props:
  type: object
  properties:
    dismissible:
      title: Dismissible
      description: 'Adds close button to dismiss the alert inline. Defaults to true.'
      type: [boolean, 'null']
    animated_dismiss:
      title: 'Animated dismiss'
      description: 'Adds fade animation to the dismissible alert. Defaults to true.'
      type: [boolean, 'null']
    heading:
      title: Heading
      description: 'The alert heading. Optional.'
      type: [string, array, object, 'null']
    message:
      title: Message
      description: 'The alert message.'
      type: [string, array, object, 'null']
    icon:
      title: 'Icon name'
      description: 'Adds an icon to the alert. Optional.'
      type: [string, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
