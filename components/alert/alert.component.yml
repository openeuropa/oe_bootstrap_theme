name: 'Alert'
description: 'Provide contextual feedback messages for typical user actions with the handful of available and flexible alert messages.'
props:
  type: object
  properties:
    variant:
      title: Variant
      type: [string, 'null']
      description: 'The alert variant. Defaults to primary.'
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
        - link
        - null
      'meta:enum':
        primary: 'Primary (default)'
        secondary: Secondary
        success: Success
        danger: Danger
        warning: Warning
        info: Info
        light: Light
        dark: Dark
        link: Link
    dismissible:
      title: Dismissible
      type: [boolean, 'null']
      description: 'Adds close button to dismiss the alert inline. Defaults to true.'
    animated_dismiss:
      title: 'Animated dismiss'
      type: [boolean, 'null']
      description: 'Adds fade animation to the dismissible alert. Defaults to true.'
    heading:
      title: Heading
      type: [string, array, object, 'null']
      description: 'The alert heading.'
    message:
      title: Message
      type: [string, array, object, 'null']
      description: 'The alert message.'
    icon:
      title: 'Icon name'
      type: [string, 'null']
      description: 'Icon name to display in the alert.'
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to icons.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
