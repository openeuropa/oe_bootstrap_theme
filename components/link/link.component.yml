name: Link
description: 'A link with optional color, icon, disabled and standalone styles.'
variants:
  primary:
    title: Primary
  secondary:
    title: Secondary
  success:
    title: Success
  danger:
    title: Danger
  warning:
    title: Warning
  info:
    title: Info
  light:
    title: Light
  dark:
    title: Dark
props:
  type: object
  properties:
    label:
      title: Label
      type: [string, array, object, 'null']
      description: 'Link label text or render array.'
    path:
      title: Path
      type: [string, object, 'null']
      description: 'Link URL string or URL object. Defaults to #.'
    id:
      title: ID
      type: [string, 'null']
      description: 'Link ID attribute.'
    disabled:
      title: Disabled
      type: [boolean, 'null']
      description: 'Disables keyboard and pointer interaction. Defaults to false.'
    standalone:
      title: Standalone
      type: [boolean, 'null']
      description: 'Applies standalone link styling. Defaults to false.'
    icon:
      title: Icon
      type: [string, object, 'null']
      description: 'Icon name as a string or an icon object.'
    icon_position:
      title: 'Icon position'
      type: [string, 'null']
      description: 'Position of the icon relative to the label. Defaults to after.'
      enum:
        - before
        - after
        - null
      'meta:enum':
        before: Before
        after: 'After (default)'
        '': Default
    icon_display:
      title: 'Icon display'
      type: [string, 'null']
      description: 'Uses flexbox gap spacing between the icon and label.'
      enum:
        - flex
        - inline-flex
        - null
      'meta:enum':
        flex: Flex
        inline-flex: 'Inline flex'
        '': Default
    remove_icon_spacers:
      title: 'Remove icon spacers'
      type: [boolean, 'null']
      description: 'Removes spacing between the icon and label. Defaults to false.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
