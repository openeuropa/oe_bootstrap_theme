name: 'Content banner'
description: 'Shows the content summary along with the title, image and badges.'
props:
  type: object
  properties:
    background:
      title: Background
      description: 'Sets a gray or white background. Defaults to white.'
      type: [string, 'null']
      default: white
      enum:
        - white
        - gray
        - null
      'meta:enum':
        white: 'White (default)'
        gray: Gray
        '': Default
    image:
      title: Image
      description: 'Image displayed in the content banner.'
      type: [object, 'null']
    copyright:
      title: Copyright
      description: 'Optional copyright text displayed below the image.'
      type: [string, array, object, 'null']
    image_size:
      title: 'Image size'
      description: 'The size of the image. Defaults to lg.'
      type: [string, 'null']
      default: lg
      enum:
        - md
        - lg
        - xl
        - null
      'meta:enum':
        md: Medium
        lg: 'Large (default)'
        xl: 'Extra large'
        '': Default
    title:
      title: Title
      description: 'Title of the content banner.'
      type: [string, array, object, 'null']
    title_tag:
      title: 'Title tag'
      description: 'The tag to use for the title. Defaults to h1.'
      type: [string, 'null']
    action_bar:
      title: 'Action bar'
      description: 'Action bar region, for example action buttons.'
      type: [string, array, object, 'null']
    content:
      title: Content
      description: 'Text with the summary of the content.'
      type: [string, array, object, 'null']
    meta:
      title: Meta
      description: 'Miscellaneous information such as date or author.'
      type: [array, 'null']
    badges:
      title: Badges
      description: 'List of badges.'
      type: [array, 'null']
    links:
      title: Links
      description: 'List of links.'
      type: [array, 'null']
    copyright_label:
      title: 'Copyright label'
      description: 'Accessible label shown before the copyright. Defaults to Image credit:.'
      type: [string, 'null']
    title_link:
      title: 'Title link'
      description: 'Optional link object for the title.'
      type: [object, 'null']
    title_attributes:
      title: 'Title attributes'
      type: [object, string, 'null']
    subtitle:
      title: Subtitle
      description: 'Optional card subtitle.'
      type: [object, 'null']
    text:
      title: Text
      description: 'Optional card text.'
      type: [object, 'null']
    date:
      title: 'Date block'
      description: 'Date block displayed in place of an image.'
      type: [object, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
