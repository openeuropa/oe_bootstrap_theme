name: Pagination
description: 'Displays navigation for a series of related content split across multiple pages.'
props:
  type: object
  properties:
    variant:
      title: Variant
      type: [string, 'null']
      description: 'Pagination presentation. Defaults to standard pagination.'
      enum:
        - default
        - glossary
        - null
      'meta:enum':
        default: Default
        glossary: Glossary
        # Value NULL becomes '' when used as array key.
        '': Default
    size:
      title: Size
      type: [string, 'null']
      description: 'Optional pagination size.'
      enum:
        - sm
        - lg
        - null
      'meta:enum':
        sm: Small
        lg: Large
        # Value NULL becomes '' when used as array key.
        '': Default
    alignment:
      title: Alignment
      type: [string, 'null']
      description: 'Optional pagination alignment.'
      enum:
        - center
        - end
        - null
      'meta:enum':
        center: Center
        end: End
        # Value NULL becomes '' when used as array key.
        '': Default
    enable_prev_next_icons:
      title: 'Enable previous and next icons'
      type: [boolean, 'null']
      description: 'Replaces previous and next labels with icons. Defaults to false.'
      default: false
    enable_first_last_icons:
      title: 'Enable first and last icons'
      type: [boolean, 'null']
      description: 'Replaces first and last labels with icons. Defaults to true.'
      default: true
    ellipsis_before:
      title: 'Ellipsis before'
      type: [boolean, 'null']
      description: 'Adds an ellipsis before the numbered items. Defaults to false.'
    ellipsis_after:
      title: 'Ellipsis after'
      type: [boolean, 'null']
      description: 'Adds an ellipsis after the numbered items. Defaults to false.'
    first:
      title: 'First link'
      type: [object, 'null']
      properties:
        path:
          type: [string, object, 'null']
        label:
          type: [string, array, object, 'null']
        disabled:
          type: [boolean, 'null']
        active:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            size:
              type: [string, 'null']
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
                - null
            transformation:
              type: [string, 'null']
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
                - null
            attributes:
              type: [object, 'null']
        attributes:
          type: [object, 'null']
    prev:
      title: 'Previous link'
      type: [object, 'null']
      properties:
        path:
          type: [string, object, 'null']
        label:
          type: [string, array, object, 'null']
        disabled:
          type: [boolean, 'null']
        active:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            size:
              type: [string, 'null']
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
                - null
            transformation:
              type: [string, 'null']
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
                - null
            attributes:
              type: [object, 'null']
        attributes:
          type: [object, 'null']
    next:
      title: 'Next link'
      type: [object, 'null']
      properties:
        path:
          type: [string, object, 'null']
        label:
          type: [string, array, object, 'null']
        disabled:
          type: [boolean, 'null']
        active:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            size:
              type: [string, 'null']
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
                - null
            transformation:
              type: [string, 'null']
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
                - null
            attributes:
              type: [object, 'null']
        attributes:
          type: [object, 'null']
    last:
      title: 'Last link'
      type: [object, 'null']
      properties:
        path:
          type: [string, object, 'null']
        label:
          type: [string, array, object, 'null']
        disabled:
          type: [boolean, 'null']
        active:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            size:
              type: [string, 'null']
              enum:
                - 2xs
                - xs
                - s
                - m
                - l
                - xl
                - 2xl
                - fluid
                - null
            transformation:
              type: [string, 'null']
              enum:
                - rotate-90
                - rotate-180
                - rotate-270
                - flip-horizontal
                - flip-vertical
                - null
            attributes:
              type: [object, 'null']
        attributes:
          type: [object, 'null']
    items:
      title: Items
      type: [array, 'null']
      description: 'Numbered or glossary pagination items.'
      items:
        type: [object, 'null']
        properties:
          path:
            type: [string, object, 'null']
          label:
            type: [string, array, object, 'null']
          disabled:
            type: [boolean, 'null']
          active:
            type: [boolean, 'null']
          icon:
            type: [string, object, 'null']
            properties:
              name:
                type: [string, 'null']
              path:
                type: [string, 'null']
              size:
                type: [string, 'null']
                enum:
                  - 2xs
                  - xs
                  - s
                  - m
                  - l
                  - xl
                  - 2xl
                  - fluid
                  - null
              transformation:
                type: [string, 'null']
                enum:
                  - rotate-90
                  - rotate-180
                  - rotate-270
                  - flip-horizontal
                  - flip-vertical
                  - null
              attributes:
                type: [object, 'null']
          attributes:
            type: [object, 'null']
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    list_attributes:
      title: 'List attributes'
      type: Drupal\Core\Template\Attribute
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
