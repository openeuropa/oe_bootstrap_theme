name: Pagination
description: 'Showing pagination to indicate a series of related content exists across multiple pages. For more information visit: https://getbootstrap.com/docs/5.0/components/pagination/'
variants:
  default:
    title: Default
    description: 'The default pagination style.'
  glossary:
    title: Glossary
    description: 'Glossary style.'
props:
  type: object
  properties:
    size:
      title: Size
      description: 'Size of the pagination:'
      type: [string, 'null']
      enum:
        - sm
        - lg
        - null
      'meta:enum':
        sm: Small
        lg: Large
        '': Default
    alignment:
      title: Alignment
      description: 'Align the pagination to:'
      type: [string, 'null']
      enum:
        - center
        - end
        - null
    list_attributes:
      title: 'List attributes'
      description: 'Extra attributes for the list container'
      type: Drupal\Core\Template\Attribute
    enable_prev_next_icons:
      title: 'Enable previous/next icons'
      description: 'Show icons instead of texts in links to previous and next page. Defaults to false.'
      type: [boolean, 'null']
    enable_first_last_icons:
      title: 'Enable first/last icons'
      description: 'Show icons instead of texts in links to first and last page. Defaults to true.'
      type: [boolean, 'null']
    first:
      title: 'First link'
      description: 'Pagination first link with path and label or icon.'
      type: [array, 'null']
    prev:
      title: 'Previous link'
      description: 'Pagination previous link with path and label or icon.'
      type: [array, 'null']
    next:
      title: 'Next link'
      description: 'Pagination next link with path and label or icon.'
      type: [array, 'null']
    last:
      title: 'Last link'
      description: 'Pagination last link with path and label or icon.'
      type: [array, 'null']
    items:
      title: 'Pagination items'
      description: 'List of items with path, label, disabled and active to build the pagination.'
      type: [array, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
