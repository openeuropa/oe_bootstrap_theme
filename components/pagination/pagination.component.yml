name: Pagination
description: 'Displays navigation for a series of related content split across multiple pages.'
variants:
  default:
    title: Default
    description: 'The default pagination style.'
  glossary:
    title: Glossary
    description: 'Glossary style.'
props:
  type: object
  properties:
    size:
      title: Size
      type: [string, 'null']
      description: 'Optional pagination size.'
      enum:
        - sm
        - lg
        - null
      'meta:enum':
        sm: Small
        lg: Large
        '': Default
    alignment:
      title: Alignment
      type: [string, 'null']
      description: 'Optional pagination alignment.'
      enum:
        - center
        - end
        - null
      'meta:enum':
        center: Center
        end: End
        '': Default
    enable_prev_next_icons:
      title: 'Enable previous and next icons'
      type: [boolean, 'null']
      description: 'Replaces previous and next labels with icons. Defaults to false.'
      default: false
    enable_first_last_icons:
      title: 'Enable first and last icons'
      type: [boolean, 'null']
      description: 'Replaces first and last labels with icons. Defaults to true.'
      default: true
    ellipsis_before:
      title: 'Ellipsis before'
      type: [boolean, 'null']
      description: 'Adds an ellipsis before the numbered items. Defaults to false.'
    ellipsis_after:
      title: 'Ellipsis after'
      type: [boolean, 'null']
      description: 'Adds an ellipsis after the numbered items. Defaults to false.'
    first:
      title: 'First link'
      type: [object, 'null']
    prev:
      title: 'Previous link'
      type: [object, 'null']
    next:
      title: 'Next link'
      type: [object, 'null']
    last:
      title: 'Last link'
      type: [object, 'null']
    items:
      title: Items
      type: [array, 'null']
      description: 'Numbered or glossary pagination items.'
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    list_attributes:
      title: 'List attributes'
      type: [object, string, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
