name: 'Banner'
description: 'Banner or heroes with text and/or background image and/or with call to action.'
props:
  type: object
  properties:
    variant:
      title: Variant
      type: [string, 'null']
      description: 'The banner variant. Defaults to default.'
      default: default
      enum:
        - default
        - primary
        - image
        - image_shade
      'meta:enum':
        default: 'Default text banner'
        primary: 'Primary text banner'
        image: 'Image banner'
        image_shade: 'Image shade banner'
    hero:
      title: Hero
      type: [boolean, 'null']
      description: 'Displays as hero banner. Defaults to false.'
    shade:
      title: Shade
      type: [boolean, 'null']
      description: 'Enables the shadow effect to the image. Defaults to true for the image shade variant and false otherwise.'
    full_width:
      title: 'Full width'
      type: [boolean, 'null']
      description: 'Allows a full-width banner within a bootstrap container. Defaults to false.'
    centered:
      title: Centered
      type: [boolean, 'null']
      description: 'Whether the content of the banner is centered or not. Defaults to false.'
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the banner.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'The tag to use for the title. Defaults to div.'
    description:
      title: Description
      type: [string, array, object, 'null']
      description: 'Sub-heading of the banner.'
    call_to_action:
      title: 'Call to action'
      type: [object, 'null']
      description: 'Link to print a CTA button.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, 'null']
        link_style:
          type: [string, 'null']
        icon_position:
          type: [string, 'null']
        icon:
          type: [object, 'null']
          properties:
            name:
              type: [string, 'null']
            size:
              type: [string, 'null']
            path:
              type: [string, 'null']
    image:
      title: Image
      type: [string, 'null']
      description: 'URL of the image.'
    copyright:
      title: Copyright
      type: [string, array, object, 'null']
      description: 'Optional copyright text displayed below the banner.'
    content_classes:
      title: 'Content classes'
      type: [string, 'null']
      description: 'Classes for the content wrapper.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
