name: 'List group'
description: 'Displays a flexible series of content as unordered, ordered, or actionable items.'
props:
  type: object
  properties:
    flush:
      title: Flush
      type: [boolean, 'null']
      description: 'Removes outer borders and rounded corners. Defaults to false.'
    horizontal:
      title: Horizontal
      type: [string, 'null']
      description: 'Displays items horizontally, optionally from a responsive breakpoint.'
      enum:
        - horizontal
        - horizontal-sm
        - horizontal-md
        - horizontal-lg
        - horizontal-xl
        - horizontal-xxl
        - null
      'meta:enum':
        horizontal: 'All viewports'
        horizontal-sm: 'Small and larger'
        horizontal-md: 'Medium and larger'
        horizontal-lg: 'Large and larger'
        horizontal-xl: 'Extra large and larger'
        horizontal-xxl: 'Extra extra large and larger'
    id:
      title: ID
      type: [string, 'null']
      description: 'List group ID attribute.'
    type:
      title: Type
      type: [string, 'null']
      description: 'Type of list group. Defaults to unordered.'
      enum:
        - unordered
        - ordered
        - actionable
        - null
      'meta:enum':
        unordered: 'Unordered (default)'
        ordered: Ordered
        actionable: Actionable
    items:
      title: Items
      type: [array, 'null']
      description: 'List content, form inputs, links, or buttons.'
      items:
        type: [object, 'null']
        properties:
          html:
            type: [string, array, object, 'null']
          variant:
            type: [string, 'null']
            enum:
              - ''
              - primary
              - secondary
              - success
              - danger
              - warning
              - info
              - light
              - dark
              - null
          extra_classes:
            type: [string, 'null']
          badge:
            type: [object, 'null']
            properties:
              label:
                type: [string, array, object, 'null']
              background:
                type: [string, 'null']
                enum:
                  - primary
                  - secondary
                  - success
                  - danger
                  - warning
                  - info
                  - light
                  - dark
                  - null
              url:
                type: [string, 'null']
              title:
                type: [string, 'null']
              dismissible:
                type: [boolean, 'null']
              assistive_text:
                type: [string, 'null']
              rounded_pill:
                type: [boolean, 'null']
              outline:
                type: [boolean, 'null']
              icon_path:
                type: [string, 'null']
              attributes:
                type: [object, 'null']
          input:
            type: [boolean, 'null']
          input_type:
            type: [string, 'null']
          label:
            type: [string, array, object, 'null']
          required:
            type: [boolean, 'null']
          checked:
            type: [boolean, 'null']
          hidden_label:
            type: [boolean, 'null']
          disabled:
            type: [boolean, 'null']
          readonly:
            type: [boolean, 'null']
          invalid:
            type: [boolean, 'null']
          valid:
            type: [boolean, 'null']
          invalid_feedback:
            type: [string, array, object, 'null']
          valid_feedback:
            type: [string, array, object, 'null']
          floating:
            type: [boolean, 'null']
          helper_text:
            type: [string, array, object, 'null']
          helper_text_id:
            type: [string, 'null']
          placeholder:
            type: [string, 'null']
          horizontal:
            type: [boolean, 'null']
          horizontal_class:
            type: [string, 'null']
          horizontal_label_class:
            type: [string, 'null']
          switch:
            type: [boolean, 'null']
          toggle:
            type: [boolean, 'null']
          toggle_variant:
            type: [string, 'null']
            enum:
              - primary
              - secondary
              - success
              - danger
              - warning
              - info
              - light
              - dark
              - null
          remove_wrapper:
            type: [boolean, 'null']
          path:
            type: [string, object, 'null']
          button:
            type: [boolean, 'null']
          id:
            type: [string, 'null']
          type:
            type: [string, 'null']
            enum:
              - button
              - submit
              - reset
              - null
          text_nowrap:
            type: [boolean, 'null']
          assistive_text:
            type: [string, 'null']
          standalone:
            type: [boolean, 'null']
          icon:
            type: [string, object, 'null']
            properties:
              name:
                type: [string, 'null']
              path:
                type: [string, 'null']
              size:
                type: [string, 'null']
                enum:
                  - 2xs
                  - xs
                  - s
                  - m
                  - l
                  - xl
                  - 2xl
                  - fluid
                  - null
              transformation:
                type: [string, 'null']
                enum:
                  - rotate-90
                  - rotate-180
                  - rotate-270
                  - flip-horizontal
                  - flip-vertical
                  - null
              attributes:
                type: [object, 'null']
          icon_position:
            type: [string, 'null']
            enum:
              - before
              - after
              - null
          icon_display:
            type: [string, 'null']
            enum:
              - flex
              - inline-flex
              - null
          icon_spacing:
            type: [string, 'null']
            enum:
              - sm
              - md
              - lg
              - null
          remove_icon_spacers:
            type: [boolean, 'null']
          spinner:
            type: [object, 'null']
            properties:
              type:
                type: [string, 'null']
                enum:
                  - border
                  - grow
                  - null
              variant:
                type: [string, 'null']
                enum:
                  - ''
                  - primary
                  - secondary
                  - success
                  - danger
                  - warning
                  - info
                  - light
                  - dark
                  - null
              size:
                type: [string, 'null']
                enum:
                  - ''
                  - sm
                  - lg
                  - null
              assistive_text:
                type: [string, 'null']
              attributes:
                type: [object, 'null']
          show_spinner:
            type: [boolean, 'null']
          attributes:
            type: [object, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
