name: 'List group'
description: 'Displays a flexible series of content as unordered, ordered, or actionable items.'
props:
  type: object
  properties:
    type:
      title: Type
      description: 'Type of list group. Defaults to unordered.'
      type: [string, 'null']
      enum:
        - unordered
        - ordered
        - actionable
        - null
      'meta:enum':
        unordered: 'Unordered (default)'
        ordered: Ordered
        actionable: Actionable
        '': Default
    flush:
      title: Flush
      description: 'Removes outer borders and rounded corners. Defaults to false.'
      type: [boolean, 'null']
    items:
      title: Items
      description: 'List content, form inputs, links, or buttons.'
      type: [array, 'null']
    horizontal:
      title: Horizontal
      description: 'Displays items horizontally, optionally from a responsive breakpoint.'
      type: [string, 'null']
      enum:
        - horizontal
        - horizontal-sm
        - horizontal-md
        - horizontal-lg
        - horizontal-xl
        - horizontal-xxl
        - null
      'meta:enum':
        horizontal: 'All viewports'
        horizontal-sm: 'Small and larger'
        horizontal-md: 'Medium and larger'
        horizontal-lg: 'Large and larger'
        horizontal-xl: 'Extra large and larger'
        horizontal-xxl: 'Extra extra large and larger'
        '': Default
    id:
      title: ID
      description: 'List group ID attribute.'
      type: [string, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
