name: 'Badge'
description: 'A small count and labeling component. Badges scale to match the size of the immediate parent element by using relative font sizing and em units.'
props:
  type: object
  properties:
    label:
      title: Label
      type: [string, array, object]
      description: 'The badge label.'
    url:
      title: 'Badge URL'
      type: string
      description: 'Converts the badge in a link.'
    title:
      title: 'Link title'
      type: string
      description: 'Title attribute if the badge is a link.'
    assistive_text:
      title: 'Assistive text'
      type: string
      description: 'Text to visually hide before the badge label.'
    background:
      title: 'Badge background'
      type: string
      description: 'Set the background color of the badge. Defaults to primary.'
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
        - link
      'meta:enum':
        primary: 'Primary (default)'
        secondary: Secondary
        success: Success
        danger: Danger
        warning: Warning
        info: Info
        light: Light
        dark: Dark
        link: Link
    rounded_pill:
      title: 'Pill badge'
      type: boolean
      description: 'Makes the badge a rounded pill. Defaults to false.'
    dismissible:
      title: 'Dismissible badge'
      type: boolean
      description: 'Adds a close icon at the end of the badge. Defaults to false.'
    outline:
      title: Outline
      type: boolean
      description: 'Uses a border instead of a background. Defaults to false.'
    icon_path:
      title: 'Icons path'
      type: string
      description: 'Path to icons.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
