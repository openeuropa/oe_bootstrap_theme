name: Progress
description: 'Indicate the progress as a bar. For more information visit: https://getbootstrap.com/docs/5.0/components/progress/'
props:
  type: object
  properties:
    style:
      title: 'Bar style'
      description: 'Set the bar style:'
      type: [string, 'null']
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
    striped:
      title: Striped
      description: 'Stripped style for the progress bar. Defaults to false.'
      type: [boolean, 'null']
    animated:
      title: Animated
      description: 'Animation on striped bar. Defaults to false.'
      type: [boolean, 'null']
    label:
      title: Label
      description: 'Text before the progress bar.'
      type: [string, array, object, 'null']
    progress:
      title: Progress
      description: 'The progress value for the bar.'
      type: [number, string, 'null']
    min:
      title: Minimum
      description: 'Minimum value shown in the progress bar.'
      type: [string, array, object, 'null']
    max:
      title: Maximum
      description: 'Maximum value shown in the progress bar.'
      type: [string, array, object, 'null']
    text:
      title: Text
      description: 'Text inside the progress bar.'
      type: [string, array, object, 'null']
    message:
      title: Message
      description: 'Optional description text below the progress bar.'
      type: [string, array, object, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
