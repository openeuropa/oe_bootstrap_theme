name: Modal
description: 'Displays content in a dialog layered over the page, with an optional trigger button.'
props:
  type: object
  properties:
    modal_id:
      title: 'Modal ID'
      type: [string, 'null']
      description: 'Unique ID connecting the modal and its trigger. A unique ID is generated when omitted.'
    size:
      title: Size
      type: [string, 'null']
      description: 'Size of the modal.'
      enum:
        - sm
        - lg
        - xl
        - fullscreen
        - null
      'meta:enum':
        sm: Small
        lg: Large
        xl: 'Extra large'
        fullscreen: Fullscreen
        # Value NULL becomes '' when used as array key.
        '': Default
    fullscreen_responsive:
      title: 'Responsive fullscreen'
      type: [string, 'null']
      description: 'Display the modal fullscreen below the selected breakpoint.'
      enum:
        - sm
        - md
        - lg
        - xl
        - xxl
        - null
      'meta:enum':
        sm: Small
        md: Medium
        lg: Large
        xl: 'Extra large'
        xxl: 'Extra extra large'
        # Value NULL becomes '' when used as array key.
        '': Default
    static_backdrop:
      title: 'Static backdrop'
      type: [boolean, 'null']
      description: 'Prevent the modal from closing when its backdrop is selected.'
    vertically_centered:
      title: 'Vertically centered'
      type: [boolean, 'null']
      description: 'Center the modal vertically in the viewport.'
    scrollable:
      title: Scrollable
      type: [boolean, 'null']
      description: 'Allow the modal body to scroll independently.'
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title displayed in the modal header.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'The tag to use for the title. Defaults to h5.'
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    show_close_button:
      title: 'Show close button'
      type: [boolean, 'null']
      description: 'Display a close button in the modal header. Defaults to false.'
    messages:
      title: Messages
      type: [string, array, object, 'null']
      description: 'Content displayed between the modal header and body.'
    body:
      title: Body
      type: [string, array, object, 'null']
      description: 'Main modal content.'
    footer:
      title: Footer
      type: [string, array, object, 'null']
      description: 'Optional modal footer content.'
    toggle:
      title: 'Toggle button'
      type: [object, 'null']
      description: 'Optional button that opens the modal.'
      properties:
        label:
          type: [string, array, object, 'null']
        variant:
          type: [string, 'null']
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
            - link
            - null
        size:
          type: [string, 'null']
          enum:
            - sm
            - md
            - lg
            - null
        type:
          type: [string, 'null']
          enum:
            - button
            - submit
            - reset
            - null
        outline:
          type: [boolean, 'null']
        disabled:
          type: [boolean, 'null']
        text_nowrap:
          type: [boolean, 'null']
        assistive_text:
          type: [string, 'null']
        id:
          type: [string, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            transformation:
              type: [string, 'null']
            attributes:
              type: [object, string, 'null']  # attributes
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
            - null
        icon_spacing:
          type: [string, 'null']
          enum:
            - sm
            - md
            - lg
            - null
        spinner:
          type: [object, 'null']
          properties:
            type:
              type: [string, 'null']
            variant:
              type: [string, 'null']
            size:
              type: [string, 'null']
            assistive_text:
              type: [string, 'null']
            attributes:
              type: [object, string, 'null']  # attributes
        show_spinner:
          type: [boolean, 'null']
        clean_class:
          type: [boolean, 'null']
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, string, 'null']  # attributes
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
    header_attributes:
      title: 'Header attributes'
      type: Drupal\Core\Template\Attribute
    body_attributes:
      title: 'Body attributes'
      type: Drupal\Core\Template\Attribute
    footer_attributes:
      title: 'Footer attributes'
      type: Drupal\Core\Template\Attribute
