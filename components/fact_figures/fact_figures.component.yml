name: 'Fact and Figures'
description: 'Fact and Figures pattern used for the paragraph of same type.'
props:
  type: object
  properties:
    alignment:
      title: Alignment
      description: 'Align icons, values, and labels. Descriptions remain left-aligned.'
      type: [string, 'null']
      enum:
        - left
        - center
      'meta:enum':
        left: 'Left (default)'
        center: Center
    title:
      title: Title
      description: 'Title of the facts & figures section.'
      type: [string, array, object, 'null']
    title_tag:
      title: 'Title tag'
      description: 'The tag to use for the title. Defaults to h2.'
      type: [string, 'null']
    columns:
      title: Columns
      description: 'One, two or three columns layout for responsive. Defaults to 3.'
      type: [number, 'null']
    items:
      title: Items
      description: 'List of facts, with icon, title, subtitle and content.'
      type: [array, 'null']
    link:
      title: Link
      description: 'Additional link to be displayed after facts. A link pattern definition must be passed.'
      type: [array, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
