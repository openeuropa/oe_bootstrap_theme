name: Gallery
description: 'A collection of images and videos displayed as thumbnails and in a modal carousel.'
props:
  type: object
  properties:
    gallery_id:
      title: 'Gallery ID'
      type: [string, 'null']
      description: 'Unique ID used to connect the gallery, modal and carousel.'
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the gallery.'
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'The tag to use for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: [object, 'null']
      description: 'Optional link applied to the gallery title.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
          'meta:enum':
            primary: Primary
            secondary: Secondary
            success: Success
            danger: Danger
            warning: Warning
            info: Info
            light: Light
            dark: Dark
        id:
          type: [string, 'null']
        disabled:
          type: [boolean, 'null']
        icon:
          type: [object, 'null']
          properties:
            name:
              type: [string, 'null']
            size:
              type: [string, 'null']
            path:
              type: [string, 'null']
            transformation:
              type: [string, 'null']
            attributes:
              type: [object, 'null']
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
        icon_display:
          type: [string, 'null']
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, 'null']
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    counter:
      title: Counter
      type: [string, 'null']
      description: 'Counter label. The %d placeholder is replaced by the number of items.'
    collapse_button_label:
      title: 'Collapsed label'
      type: [string, 'null']
      description: 'Label used to reveal hidden thumbnails. Defaults to View the full gallery (%d).'
    expand_button_label:
      title: 'Expanded label'
      type: [string, 'null']
      description: 'Label used to hide expanded thumbnails. Defaults to View less.'
    previous_label:
      title: 'Previous label'
      type: [string, 'null']
      description: 'Accessible label for the previous carousel control. Defaults to Previous.'
    next_label:
      title: 'Next label'
      type: [string, 'null']
      description: 'Accessible label for the next carousel control. Defaults to Next.'
    max_visible_thumbnails:
      title: 'Maximum visible thumbnails'
      type: [integer, 'null']
      description: 'Number of thumbnails visible before the gallery is collapsed. Defaults to 5.'
    items:
      title: Items
      type: [array, 'null']
      description: 'Images and playable media displayed in the gallery.'
      items:
        type: [object, 'null']
        properties:
          thumbnail:
            title: Thumbnail
            type: [string, array, object, 'null']
          media:
            title: Media
            type: [string, array, object, 'null']
          caption_title:
            title: 'Caption title'
            type: [string, array, object, 'null']
          caption:
            title: Caption
            type: [string, array, object, 'null']
          caption_classes:
            title: 'Caption classes'
            type: [string, 'null']
          copyright:
            title: Copyright
            type: [string, array, object, 'null']
          copyright_label:
            title: 'Copyright label'
            type: [string, 'null']
          interval:
            title: Interval
            type: [integer, 'null']
          link:
            title: Link
            type: [object, 'null']
            properties:
              label:
                type: [string, array, object, 'null']
              path:
                type: [string, object, 'null']
              variant:
                type: [string, 'null']
                enum:
                  - primary
                  - secondary
                  - success
                  - danger
                  - warning
                  - info
                  - light
                  - dark
                'meta:enum':
                  primary: Primary
                  secondary: Secondary
                  success: Success
                  danger: Danger
                  warning: Warning
                  info: Info
                  light: Light
                  dark: Dark
              id:
                type: [string, 'null']
              disabled:
                type: [boolean, 'null']
              standalone:
                type: [boolean, 'null']
              icon:
                type: [object, 'null']
                properties:
                  name:
                    type: [string, 'null']
                  size:
                    type: [string, 'null']
                  path:
                    type: [string, 'null']
                  transformation:
                    type: [string, 'null']
                  attributes:
                    type: [object, 'null']
              icon_position:
                type: [string, 'null']
                enum:
                  - before
                  - after
              icon_display:
                type: [string, 'null']
                enum:
                  - flex
                  - inline-flex
              remove_icon_spacers:
                type: [boolean, 'null']
              attributes:
                type: [object, 'null']
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
