name: Gallery
description: 'A collection of images and videos.'
slots:
  title:
    title: Title
    description: 'Title of the gallery.'
  title_tag:
    title: 'Title tag'
    description: 'The tag to use for the title. Defaults to h2.'
props:
  type: object
  properties:
    thumbnail_fit:
      title: 'Thumbnail fit'
      description: 'Controls how thumbnails fit their grid cells. Cover fills the available space and may crop images.'
      type: [string, 'null']
      enum:
        - original
        - cover
      'meta:enum':
        original: 'Original aspect ratio (default)'
        cover: Cover
      default: original
    items:
      title: Items
      description: 'A list of '
      type: [array, 'null']
