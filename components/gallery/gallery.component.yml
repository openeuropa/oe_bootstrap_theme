name: Gallery
description: 'A collection of images and videos displayed as thumbnails and in a modal carousel.'
props:
  type: object
  properties:
    gallery_id:
      title: 'Gallery ID'
      type: string
      description: 'Unique ID used to connect the gallery, modal and carousel.'
    title:
      title: Title
      type: [string, array, object]
      description: 'Title of the gallery.'
    title_tag:
      title: 'Title tag'
      type: string
      description: 'The tag to use for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: object
      description: 'Optional link applied to the gallery title.'
      properties:
        label:
          type: [string, array, object]
        path:
          type: [string, object]
        variant:
          type: string
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
          'meta:enum':
            primary: Primary
            secondary: Secondary
            success: Success
            danger: Danger
            warning: Warning
            info: Info
            light: Light
            dark: Dark
        id:
          type: string
        disabled:
          type: boolean
        icon:
          type: object
          properties:
            name:
              type: string
            size:
              type: string
            path:
              type: string
            transformation:
              type: string
            attributes:
              type: object
        icon_position:
          type: string
          enum:
            - before
            - after
        icon_display:
          type: string
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: boolean
        attributes:
          type: object
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    counter:
      title: Counter
      type: string
      description: 'Counter label. The %d placeholder is replaced by the number of items.'
    collapse_button_label:
      title: 'Collapsed label'
      type: string
      description: 'Label used to reveal hidden thumbnails. Defaults to View the full gallery (%d).'
    expand_button_label:
      title: 'Expanded label'
      type: string
      description: 'Label used to hide expanded thumbnails. Defaults to View less.'
    previous_label:
      title: 'Previous label'
      type: string
      description: 'Accessible label for the previous carousel control. Defaults to Previous.'
    next_label:
      title: 'Next label'
      type: string
      description: 'Accessible label for the next carousel control. Defaults to Next.'
    max_visible_thumbnails:
      title: 'Maximum visible thumbnails'
      type: integer
      description: 'Number of thumbnails visible before the gallery is collapsed. Defaults to 5.'
    items:
      title: Items
      type: array
      description: 'Images and playable media displayed in the gallery.'
      items:
        type: object
        properties:
          thumbnail:
            title: Thumbnail
            type: [string, array, object]
          media:
            title: Media
            type: [string, array, object]
          caption_title:
            title: 'Caption title'
            type: [string, array, object]
          caption:
            title: Caption
            type: [string, array, object]
          caption_classes:
            title: 'Caption classes'
            type: string
          copyright:
            title: Copyright
            type: [string, array, object]
          copyright_label:
            title: 'Copyright label'
            type: string
          interval:
            title: Interval
            type: integer
          link:
            title: Link
            type: object
            properties:
              label:
                type: [string, array, object]
              path:
                type: [string, object]
              variant:
                type: string
                enum:
                  - primary
                  - secondary
                  - success
                  - danger
                  - warning
                  - info
                  - light
                  - dark
                'meta:enum':
                  primary: Primary
                  secondary: Secondary
                  success: Success
                  danger: Danger
                  warning: Warning
                  info: Info
                  light: Light
                  dark: Dark
              id:
                type: string
              disabled:
                type: boolean
              standalone:
                type: boolean
              icon:
                type: object
                properties:
                  name:
                    type: string
                  size:
                    type: string
                  path:
                    type: string
                  transformation:
                    type: string
                  attributes:
                    type: object
              icon_position:
                type: string
                enum:
                  - before
                  - after
              icon_display:
                type: string
                enum:
                  - flex
                  - inline-flex
              remove_icon_spacers:
                type: boolean
              attributes:
                type: object
    icon_path:
      title: 'Icons path'
      type: string
      description: 'Path to the SVG icon file. Defaults to the BCL icon path.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
