name: Timeline
description: 'Timeline is a flexible and powerful component for displaying a series of content ordered in time.'
props:
  type: object
  properties:
    hide_from:
      title: 'Hide from'
      description: 'Indicate the number of items to display in the timeline, hide the others and add a toggle button to show them.'
      type: [number, 'null']
    title:
      title: Title
      description: 'Title of the timeline block.'
      type: [string, array, object, 'null']
    title_tag:
      title: 'Title tag'
      description: 'The tag to use for the title. Defaults to h2.'
      type: [string, 'null']
    expand_button_label:
      title: 'Label expanded'
      description: 'When all items are displayed, the label of the button to hide them.'
      type: [string, 'null']
    collapse_button_label:
      title: 'Label collapsed'
      description: 'When there are hidden items, the label of the button to expand them.'
      type: [string, 'null']
    items:
      title: Items
      description: 'List of timeline items, with id, label, title and content.'
      type: [array, 'null']
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
