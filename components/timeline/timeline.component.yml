name: Timeline
description: 'Timeline is a flexible and powerful component for displaying a series of content ordered in time.'
props:
  type: object
  properties:
    title:
      title: Title
      type: [string, array, object, 'null']
      description: 'Title of the timeline block.'
    title_link:
      title: 'Title link'
      type: [object, 'null']
      description: 'Link applied to the timeline title.'
      properties:
        label:
          type: [string, array, object, 'null']
        path:
          type: [string, object, 'null']
        variant:
          type: [string, 'null']
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
            - null
        id:
          type: [string, 'null']
        disabled:
          type: [boolean, 'null']
        icon:
          type: [string, object, 'null']
          properties:
            name:
              type: [string, 'null']
            path:
              type: [string, 'null']
            transformation:
              type: [string, 'null']
            attributes:
              type: [object, string, 'null']  # attributes
        icon_position:
          type: [string, 'null']
          enum:
            - before
            - after
            - null
        icon_display:
          type: [string, 'null']
          enum:
            - flex
            - inline-flex
            - null
        remove_icon_spacers:
          type: [boolean, 'null']
        attributes:
          type: [object, string, 'null']  # attributes
    title_tag:
      title: 'Title tag'
      type: [string, 'null']
      description: 'The tag to use for the title. Defaults to h2.'
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    expand_button_label:
      title: 'Label expanded'
      type: [string, 'null']
      description: 'When all items are displayed, the label of the button to hide them.'
    collapse_button_label:
      title: 'Label collapsed'
      type: [string, 'null']
      description: 'When there are hidden items, the label of the button to expand them.'
    hide_from:
      title: 'Hide from'
      type: [integer, 'null']
      description: 'Indicate the number of items to display in the timeline, hide the others and add a toggle button to show them.'
    hide_to:
      title: 'Hide to'
      type: [integer, 'null']
      description: 'Indicate the number of bottom items to keep displayed when items are hidden. Defaults to 0.'
    items:
      title: Items
      type: [array, 'null']
      description: 'List of timeline items, with id, label, title and content.'
      items:
        type: [object, 'null']
        properties:
          id:
            type: [string, 'null']
          label:
            type: [string, array, object, 'null']
          title:
            type: [string, array, object, 'null']
          content:
            type: [string, array, object, 'null']
          attributes:
            type: [object, string, 'null']  # attributes
    icon_path:
      title: 'Icons path'
      type: [string, 'null']
      description: 'Path to icons.'
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
