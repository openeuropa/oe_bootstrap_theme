name: 'Featured media'
description: 'Presents an image, embedded media or video, optionally alongside descriptive content.'
props:
  type: object
  properties:
    caption:
      title: Caption
      type: [string, array, object]
      description: 'Caption displayed below the media.'
    embedded_media:
      title: 'Embedded media'
      type: [string, array, object]
      description: 'Embedded media markup or render array.'
    image:
      title: Image
      type: [string, array, object]
      description: 'Rendered image or an object containing image attributes.'
      properties:
        src:
          type: string
        alt:
          type: string
        name:
          type: string
        title:
          type: string
        responsive:
          type: boolean
        loading:
          type: string
        width:
          type: [string, integer]
        height:
          type: [string, integer]
        class:
          type: [string, array, object]
    poster_image:
      title: 'Poster image'
      type: string
      description: 'Poster image URL for native video.'
    sources:
      title: 'Video sources'
      type: array
      description: 'Source files for native video.'
      items:
        type: object
        properties:
          type:
            type: string
          src:
            type: string
    tracks:
      title: 'Video tracks'
      type: array
      description: 'Caption or subtitle tracks for native video.'
      items:
        type: object
        properties:
          kind:
            type: string
          label:
            type: string
          src:
            type: string
          src_lang:
            type: string
    ratio:
      title: Ratio
      type: string
      description: 'Aspect ratio for embedded media. Defaults to 16x9.'
      enum:
        - 1x1
        - 4x3
        - 16x9
        - 21x9
      'meta:enum':
        1x1: '1:1'
        4x3: '4:3'
        16x9: '16:9 (default)'
        21x9: '21:9'
    title:
      title: Title
      type: [string, array, object]
      description: 'Title displayed above the featured media.'
    title_tag:
      title: 'Title tag'
      type: string
      description: 'Tag used for the title. Defaults to h2.'
    title_link:
      title: 'Title link'
      type: object
      description: 'Link applied to the title.'
      properties:
        label:
          type: [string, array, object]
        path:
          type: [string, object]
        id:
          type: string
        disabled:
          type: boolean
        icon:
          type: [string, object]
          properties:
            name:
              type: string
            path:
              type: string
            transformation:
              type: string
            attributes:
              type: object
        icon_position:
          type: string
          enum:
            - before
            - after
        icon_display:
          type: string
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: boolean
        attributes:
          type: object
    subtitle:
      title: Subtitle
      type: [string, array, object]
      description: 'Subtitle displayed before the text.'
    subtitle_tag:
      title: 'Subtitle tag'
      type: string
      description: 'Tag used for the subtitle. Defaults to h3 with a title and h2 without one.'
    text:
      title: Text
      type: [string, array, object]
      description: 'Content displayed alongside the media.'
    text_position:
      title: 'Text position'
      type: string
      description: 'Position of the text on medium and larger viewports. Defaults to left.'
      enum:
        - left
        - right
      'meta:enum':
        left: 'Left (default)'
        right: Right
    link:
      title: Link
      type: object
      description: 'Optional link displayed after the text.'
      properties:
        label:
          type: [string, array, object]
        path:
          type: [string, object]
        variant:
          type: string
          enum:
            - primary
            - secondary
            - success
            - danger
            - warning
            - info
            - light
            - dark
        id:
          type: string
        disabled:
          type: boolean
        standalone:
          type: boolean
        icon:
          type: [string, object]
          properties:
            name:
              type: string
            path:
              type: string
            transformation:
              type: string
            attributes:
              type: object
        icon_position:
          type: string
          enum:
            - before
            - after
        icon_display:
          type: string
          enum:
            - flex
            - inline-flex
        remove_icon_spacers:
          type: boolean
        attributes:
          type: object
    copyright:
      title: Copyright
      type: [string, array, object]
      description: 'Optional copyright text displayed below the media.'
    copyright_label:
      title: 'Copyright label'
      type: string
      description: 'Visually hidden label for copyright text.'
    content_classes:
      title: 'Caption classes'
      type: string
      description: 'Classes applied to the caption. Defaults to bg-light p-3.'
    icon_path:
      title: 'Icons path'
      type: string
      description: 'Path to icons used by links. Defaults to the BCL icon path.'
    title_attributes:
      title: 'Title attributes'
      type: Drupal\Core\Template\Attribute
    subtitle_attributes:
      title: 'Subtitle attributes'
      type: Drupal\Core\Template\Attribute
    media_attributes:
      title: 'Media attributes'
      type: Drupal\Core\Template\Attribute
    attributes:
      title: Attributes
      type: Drupal\Core\Template\Attribute
