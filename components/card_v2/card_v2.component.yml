name: 'Card V2'
description: 'Bootstrap 5 card component in its second iteration. Every zone is exposed as a render prop so plain markup, views, or other components can be placed inside.'
variants:
  default:
    title: Default
    description: '16:9 media on top, content below. Ideal for news, search results, dashboards.'
  horizontal:
    title: Horizontal
    description: '1:1 media left, content right – compact lists, sidebars.'
props:
  type: object
  properties:
    tag:
      title: 'HTML wrapper tag'
      description: 'Semantic element for the outer wrapper. Defaults to article.'
      type: [string, 'null']
      enum:
        - article
        - section
        - aside
        - div
        - null
      'meta:enum':
        article: '<article> (default)'
        section: '<section>'
        aside: '<aside>'
        div: '<div>'
        '': Default
    attributes:
      title: 'Card attributes'
      type: Drupal\Core\Template\Attribute
    media_attributes:
      title: 'Media attributes'
      type: [object, string, 'null']
    content_attributes:
      title: 'Body attributes'
      type: [object, string, 'null']
    header_attributes:
      title: 'Header attributes'
      type: [object, string, 'null']
    footer_attributes:
      title: 'Footer attributes'
      type: [object, string, 'null']
    title:
      title: Title
      description: 'Card title. Supports markup, e.g. for links.'
      type: [string, array, object, 'null']
    media:
      title: Media
      description: 'Optional. Accepts an image, video, icon, map thumbnail, or another component.'
      type: [string, array, object, 'null']
    content:
      title: 'Body content'
      description: 'Card body content.'
      type: [string, array, object, 'null']
    header:
      title: Header
      description: 'Optional meta information or category content.'
      type: [string, array, object, 'null']
    footer:
      title: Footer
      description: 'Optional secondary actions or metadata.'
      type: [string, array, object, 'null']
