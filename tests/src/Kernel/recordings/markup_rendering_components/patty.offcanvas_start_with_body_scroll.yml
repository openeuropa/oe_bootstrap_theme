- !tag:div/
  - !attr:aria-labelledby: offcanvas-title
  - !attr:class:
    - offcanvas-lg
    - offcanvas-start
  - !attr:data-bs-backdrop: 'false'
  - !attr:data-bs-scroll: 'true'
  - !attr:data-drupal-selector: offcanvas
  - !attr:id: offcanvas
  - !attr:tabindex: '-1'
  - !tag:div/
    - !attr:class:
      - offcanvas-header
    - !tag:h2/
      - !attr:class:
        - bcl-heading
        - offcanvas-title
      - !attr:id: offcanvas-title
      - 'Offcanvas title'
    - !tag:button/
      - !attr:aria-controls: offcanvas
      - !attr:aria-label: Close
      - !attr:class:
        - btn-close
        - text-reset
      - !attr:data-bs-dismiss: offcanvas
      - !attr:data-bs-target: '#offcanvas'
      - !attr:type: button
  - !tag:div/
    - !attr:class:
      - offcanvas-body
    - 'This is the offcanvas body content.'
