- !tag:div/
  - !attr:class:
    - offcanvas-lg
    - offcanvas-start
  - !attr:data-drupal-selector: offcanvas
  - !attr:id: bcl-offcanvas
  - !attr:tabindex: '-1'
  - !tag:div/
    - !attr:class:
      - offcanvas-header
    - !tag:button/
      - !attr:aria-controls: bcl-offcanvas
      - !attr:aria-label: Close
      - !attr:class:
        - btn-close
        - text-reset
      - !attr:data-bs-dismiss: offcanvas
      - !attr:data-bs-target: '#bcl-offcanvas'
      - !attr:type: button
  - !tag:div/
    - !attr:class:
      - offcanvas-body
    - 'This is the offcanvas body content.'
