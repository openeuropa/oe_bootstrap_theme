- !tag:nav/
  - !attr:class:
    - bg-dark
    - navbar
    - navbar-dark
    - navbar-expand-md
  - !attr:data-drupal-selector: navbar
  - !tag:div/
    - !attr:class:
      - container
    - !tag:a/
      - !attr:class:
        - navbar-brand
      - !attr:href: 'https://europa.eu/'
      - !attr:rel: home
      - 'OpenEuropa Site'
    - !tag:button/
      - !attr:aria-controls: bcl-navbar
      - !attr:aria-expanded: 'false'
      - !attr:aria-label: 'Toggle navigation'
      - !attr:class:
        - navbar-toggler
      - !attr:data-bs-target: '#bcl-navbar'
      - !attr:data-bs-toggle: collapse
      - !attr:type: button
      - !tag:span/
        - !attr:class:
          - navbar-toggler-icon
    - !tag:div/
      - !attr:class:
        - collapse
        - navbar-collapse
      - !attr:id: bcl-navbar
      - !tag:a/
        - !attr:class:
          - nav-link
        - !attr:href: '#first'
        - "I'm a link"
      - ' '
      - !tag:a/
        - !attr:class:
          - nav-link
        - !attr:href: '#second'
        - "I'm a link 2"
      - ' '
      - !tag:a/
        - !attr:class:
          - nav-link
        - !attr:href: '#third'
        - "I'm a link 3"
      - !tag:div/
        - !attr:class:
          - dropdown
        - !tag:button/
          - !attr:aria-expanded: 'false'
          - !attr:autocomplete: 'off'
          - !attr:class:
            - btn
            - btn-md
            - btn-primary
            - dropdown-toggle
          - !attr:data-bs-toggle: dropdown
          - !attr:id: bcl-dropdown
          - !attr:type: button
          - 'Dropdown Toggle'
        - !tag:ul/
          - !attr:aria-labelledby: bcl-dropdown
          - !attr:class:
            - dropdown-menu
          - !tag:li/
            - !tag:a/
              - !attr:class:
                - dropdown-item
              - !attr:href: '#navbar-dropdown-link'
              - "I'm a link in a dropdown"
          - !tag:li/
            - !tag:button/
              - !attr:class:
                - dropdown-item
              - !attr:type: button
              - "I'm a button"
      - !tag:form/
        - !attr:class:
          - d-flex
        - !tag:label/
          - !attr:class:
            - form-label
            - visually-hidden
          - !attr:for: inlineFormInputGroupSearch
          - Search
        - !tag:input/
          - !attr:class:
            - form-control
          - !attr:id: inlineFormInputGroupSearch
          - !attr:placeholder: Search
          - !attr:required: 'true'
          - !attr:type: text
        - !tag:div/
          - !attr:class:
            - ms-2
          - !tag:button/
            - !attr:class:
              - btn
              - btn-md
              - btn-primary
            - !attr:type: Search
            - Search
