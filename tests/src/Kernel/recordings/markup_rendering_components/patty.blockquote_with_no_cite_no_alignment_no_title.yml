- !tag:figure/
  - !attr:class:
    - bg-lighter
    - border-4
    - border-secondary
    - border-start
    - p-2
    - px-2-5
    - text-left
  - !attr:data-drupal-selector: blockquote
  - !tag:blockquote/
    - !attr:class:
      - blockquote
      - mb-2
    - !tag:p/
      - 'A well-known quote, contained in a blockquote element.'
  - !tag:figcaption/
    - !attr:class:
      - blockquote-footer
      - m-0
    - 'Someone famous in'
