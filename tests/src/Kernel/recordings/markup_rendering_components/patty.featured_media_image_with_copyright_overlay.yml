- !tag:div/
  - !attr:class:
    - bcl-featured-media
  - !attr:data-drupal-selector: featured-media
  - !tag:div/
    - !attr:class:
      - row
    - !tag:div/
      - !attr:class:
        - col-12
        - col-md-4
      - !tag:figure/
        - !attr:class:
          - overflow-hidden
          - rounded
        - !tag:img/
          - !attr:alt: 'Alternative text for paragraph image'
          - !attr:class:
            - flex-end-100
            - img-fluid
          - !attr:src: 'https://picsum.photos/1200/600/'
          - !attr:title: Example
        - !tag:figcaption/
          - !tag:div/
            - !attr:class:
              - bg-light
              - p-3
            - 'Media description text goes here.'
          - !tag:div/
            - !attr:class:
              - bcl-copyright
            - !tag:span/
              - !attr:class:
                - visually-hidden
              - 'Image credit: '
            - '© 2024 Example Organisation'
