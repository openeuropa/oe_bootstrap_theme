- !tag:div/
  - !attr:class:
    - alert
    - alert-dismissible
    - alert-info
    - align-items-center
    - d-flex
    - text-dark
  - !attr:data-drupal-selector: alert
  - !attr:role: alert
  - !tag:svg/
    - !attr:class:
      - align-self-start
      - bi
      - flex-shrink-0
      - icon--s
      - me-3
      - mt-1
      - text-info
    - !tag:use/
      - !attr:xlink:href: '/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#lock'
  - !tag:div/
    - !attr:class:
      - alert-content
      - flex-grow-1
    - !tag:div/
      - !attr:class:
        - alert-heading
        - h4
      - 'Well done!'
    - 'A simple alert. check it out!'
  - !tag:button/
    - !attr:aria-label: Close
    - !attr:class:
      - btn-close
    - !attr:data-bs-dismiss: alert
    - !attr:type: button
