    - !tag:span/
      - !attr:class:
        - carousel-control-prev-icon
    - !tag:span/
      - !attr:class:
        - visually-hidden
      - Previous
  - !tag:button/
    - !attr:class:
      - carousel-control-next
    - !attr:data-bs-slide: next
    - !attr:data-bs-target: '#bcl-carousel'
    - !attr:type: button
    - !tag:span/
      - !attr:class:
        - carousel-control-next-icon
    - !tag:span/
      - !attr:class:
        - visually-hidden
      - Next
