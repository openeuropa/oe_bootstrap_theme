            - 'First slide caption'
          - !tag:a/
            - !attr:href: 'https://link.one'
            - !tag:svg/
              - !attr:class:
                - bi
                - icon--s
                - me-2-5
              - !tag:use/
                - !attr:xlink:href: '/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#link'
            - 'First link'
    - !tag:div/
      - !attr:class:
        - carousel-item
      - !attr:data-bs-interval: '2'
      - !tag:figure/
        - !attr:class:
          - h-100
          - m-0
