<article
  class="card"
>
  <div
    class="card-header"
  >
    Header of card
  </div>
  <figure
    class="bcl-card__image-wrapper m-0"
  >
    <img
      alt="Alternative text for card image"
      class="card-img-top rounded-0"
      src="https://picsum.photos/1000/500/"
    />
  </figure>
  <div
    class="card-body"
  >
    <div
      class="bcl-heading card-title h4"
    >
      Title card
    </div>
    <h6
      class="card-subtitle"
    >
      Subtitle card
    </h6>
    <div
      class="card-text mt-2"
    >
      Text card with longer text which is supported
    </div>
    <div
      class="mt-3"
    >
      <button
        class="btn btn-md btn-primary"
        type="button"
      >
        Custom action
      </button>
    </div>
  </div>
  <div
    class="card-footer"
  >
    Footer of card
  </div>
</article>
