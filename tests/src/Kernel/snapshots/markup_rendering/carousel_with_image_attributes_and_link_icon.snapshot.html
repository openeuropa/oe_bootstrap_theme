<div
  class="carousel slide"
  data-bs-ride="carousel"
  id="bcl-carousel"
>
  <div
    class="carousel-inner"
  >
    <div
      class="active carousel-item"
    >
      <figure
        class="h-100 m-0"
      >
        <img
          alt="alt image 1"
          class="custom-image-class d-block w-100"
          height="500"
          loading="lazy"
          src="https://images.site.example1"
          title="Image title"
          width="1000"
        />
        <div
          class="carousel-caption"
        >
          <div
            class="fs-5"
          >
            First slide title
          </div>
          First slide caption
          <a
            class="custom-link-class"
            href="https://link.one"
          >
            <svg
              class="bi icon--s me-2-5"
            >
              <use
                xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#link"
              ></use>
            </svg>
            First link
          </a>
        </div>
      </figure>
    </div>
  </div>
  <button
    class="carousel-control-prev"
    data-bs-slide="prev"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-prev-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Previous
    </span>
  </button>
  <button
    class="carousel-control-next"
    data-bs-slide="next"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-next-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Next
    </span>
  </button>
</div>
