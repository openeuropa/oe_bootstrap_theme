<div
  class="carousel carousel-fade slide"
  data-bs-ride="carousel"
  data-bs-touch="false"
  id="bcl-carousel"
>
  <div
    class="carousel-indicators d-md-flex d-none"
  >
    <button
      aria-current=""
      aria-label="Slide 1"
      class="active"
      data-bs-slide-to="0"
      data-bs-target="#bcl-carousel"
      type="button"
    ></button>
  </div>
  <div
    class="carousel-inner"
  >
    <div
      class="active carousel-item"
      data-bs-interval="0"
    >
      <figure
        class="h-100 m-0"
      >
        <img
          alt="alt image 1"
          class="d-block w-100"
          src="https://images.site.example1"
        />
        <div
          class="carousel-caption d-md-block d-none"
        >
          <div
            class="fs-5"
          >
            First slide title
          </div>
          First slide caption
        </div>
      </figure>
    </div>
  </div>
  <button
    class="carousel-control-prev"
    data-bs-slide="prev"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-prev-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Previous
    </span>
  </button>
  <button
    class="carousel-control-next"
    data-bs-slide="next"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-next-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Next
    </span>
  </button>
</div>
