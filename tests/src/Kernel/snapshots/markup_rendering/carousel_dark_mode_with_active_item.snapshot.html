<div
  class="carousel carousel-dark slide"
  data-bs-ride="carousel"
  id="bcl-carousel"
>
  <div
    class="carousel-indicators d-md-flex d-none"
  >
    <button
      aria-current=""
      aria-label="Slide 1"
      class="active"
      data-bs-slide-to="0"
      data-bs-target="#bcl-carousel"
      type="button"
    ></button>
    <button
      aria-label="Slide 2"
      data-bs-slide-to="1"
      data-bs-target="#bcl-carousel"
      type="button"
    ></button>
  </div>
  <div
    class="carousel-inner"
  >
    <div
      class="active carousel-item"
    >
      <figure
        class="h-100 m-0"
      >
        <img
          alt="alt image 1"
          class="d-block w-100"
          src="https://images.site.example1"
        />
      </figure>
    </div>
    <div
      class="carousel-item"
    >
      <figure
        class="h-100 m-0"
      >
        <img
          alt="alt image 2"
          class="d-block w-100"
          src="https://images.site.example2"
        />
      </figure>
    </div>
  </div>
  <button
    class="carousel-control-prev"
    data-bs-slide="prev"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-prev-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Previous
    </span>
  </button>
  <button
    class="carousel-control-next"
    data-bs-slide="next"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-next-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Next
    </span>
  </button>
</div>
