<section
  aria-label="Featured content"
  aria-roledescription="carousel"
  class="bcl-carousel-v2 bcl-carousel-v2--split carousel carousel-fade slide"
  data-bcl-autoplay="true"
  data-bcl-pause-on-hover="false"
  data-bs-interval="10000"
  data-bs-pause="false"
  data-bs-ride="false"
  data-bs-touch="true"
  id="bcl-carousel-v2"
  role="region"
>
  <div
    class="bcl-carousel-v2__controls"
    hidden
  >
    <button
      aria-controls="bcl-carousel-v2-slides"
      aria-label="Play slides"
      class="bcl-carousel-v2__control btn btn-outline-primary"
      data-bcl-pause-label="Pause slides"
      data-bcl-play-label="Play slides"
      data-bcl-rotation=""
      type="button"
    >
      <span
        aria-hidden="true"
        data-bcl-play-icon=""
      >
        <svg
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#play-fill"
          ></use>
        </svg>
      </span>
      <span
        aria-hidden="true"
        data-bcl-pause-icon=""
        hidden
      >
        <svg
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#pause-fill"
          ></use>
        </svg>
      </span>
    </button>
    <div
      class="bcl-carousel-v2__navigation"
    >
      <button
        aria-controls="bcl-carousel-v2-slides"
        aria-label="Previous slide"
        class="bcl-carousel-v2__control btn btn-outline-primary"
        data-bs-slide="prev"
        data-bs-target="#bcl-carousel-v2"
        type="button"
      >
        <svg
          aria-hidden="true"
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#chevron-left"
          ></use>
        </svg>
      </button>
      <button
        aria-controls="bcl-carousel-v2-slides"
        aria-label="Next slide"
        class="bcl-carousel-v2__control btn btn-outline-primary"
        data-bs-slide="next"
        data-bs-target="#bcl-carousel-v2"
        type="button"
      >
        <svg
          aria-hidden="true"
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#chevron-right"
          ></use>
        </svg>
      </button>
      <span
        aria-hidden="true"
        class="bcl-carousel-v2__counter"
      >
        <span
          data-bcl-current=""
        >
          1
        </span>
        /
        <span>
          2
        </span>
      </span>
    </div>
  </div>
  <div
    aria-live="off"
    class="carousel-inner"
    id="bcl-carousel-v2-slides"
  >
    <div
      aria-label="First slide title — 1 of 2"
      aria-roledescription="slide"
      class="active carousel-item"
      role="group"
    >
      <div
        class="bcl-carousel-v2__layout"
      >
        <div
          class="bcl-carousel-v2__image"
        >
          <span
            aria-hidden="true"
            class="bcl-carousel-v2__progress"
            hidden
          ></span>

          <img
            alt="alt image 1"
            src="https://images.site.example/1"
          />
        </div>
        <div
          class="bcl-carousel-v2__content"
        >
          <p
            class="bcl-carousel-v2__title"
          >
            First slide title
          </p>
        </div>
      </div>
    </div>
    <div
      aria-label="Second slide title — 2 of 2"
      aria-roledescription="slide"
      class="carousel-item"
      role="group"
    >
      <div
        class="bcl-carousel-v2__layout"
      >
        <div
          class="bcl-carousel-v2__image"
        >
          <span
            aria-hidden="true"
            class="bcl-carousel-v2__progress"
            hidden
          ></span>

          <img
            alt="alt image 2"
            src="https://images.site.example/2"
          />
        </div>
        <div
          class="bcl-carousel-v2__content"
        >
          <p
            class="bcl-carousel-v2__title"
          >
            Second slide title
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
