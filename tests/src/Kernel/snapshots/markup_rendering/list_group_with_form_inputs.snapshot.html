<ul
  class="list-group"
>
  <li
    class="list-group-item"
  >
    <div
      class="form-check form-switch"
    >
      <input
        checked
        class="custom-checkbox form-check-input"
        data-input-attribute="checkbox"
        id="list-group-checkbox"
        required
        type="checkbox"
      />
      <label
        class="form-check-label"
        for="list-group-checkbox"
      >
        Checked switch
      </label>
    </div>
  </li>
  <li
    class="list-group-item"
  >
    <label
      class="col-form-label col-sm-4 visually-hidden"
      for="list-group-text"
    >
      Horizontal text input
    </label>
    <div
      class="col-sm-8"
    >
      <input
        aria-describedby="list-group-text-help"
        class="form-control is-valid"
        disabled
        id="list-group-text"
        placeholder="Enter a value"
        readonly
        type="text"
      />
    </div>
    <div
      class="valid-feedback"
    >
      The value is valid.
    </div>
    <div
      class="form-text"
      id="list-group-text-help"
    >
      Supporting text.
    </div>
  </li>
  <li
    class="list-group-item"
  >
    <div
      class="form-floating"
    >
      <input
        class="form-control is-invalid"
        id="list-group-invalid"
        placeholder="Enter a value"
        type="text"
      />
      <label
        class="form-label"
        for="list-group-invalid"
      >
        Invalid floating input
      </label>
      <div
        class="invalid-feedback"
      >
        Enter a valid value.
      </div>
    </div>
  </li>
  <li
    class="list-group-item"
  >
    <input
      checked
      class="btn-check form-check-input"
      id="list-group-toggle"
      type="checkbox"
    />
    <label
      class="btn btn-danger form-check-label"
      for="list-group-toggle"
    >
      Toggle input
    </label>
  </li>
</ul>
