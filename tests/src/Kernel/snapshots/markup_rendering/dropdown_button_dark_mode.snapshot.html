<div
  class="dropdown"
>
  <button
    aria-expanded="false"
    autocomplete="off"
    class="btn btn-md btn-primary dropdown-toggle"
    data-bs-toggle="dropdown"
    id="bcl-dropdown"
    type="button"
  >
    Dropdown toggle
  </button>
  <ul
    aria-labelledby="bcl-dropdown"
    class="dropdown-menu dropdown-menu-dark"
  >
    <li>
      <a
        class="dropdown-item"
        href="#"
      >
        A link
      </a>
    </li>
    <li>
      <button
        class="dropdown-item"
        type="button"
      >
        A button
      </button>
    </li>
    <li>
      <hr
        class="dropdown-divider"
      />
    </li>
    <li>
      <button
        aria-disabled="true"
        class="dropdown-item"
        disabled
        type="button"
      >
        A disabled button
      </button>
    </li>
    <li>
      <button
        class="active dropdown-item"
        type="button"
      >
        An active button
      </button>
    </li>
  </ul>
</div>
