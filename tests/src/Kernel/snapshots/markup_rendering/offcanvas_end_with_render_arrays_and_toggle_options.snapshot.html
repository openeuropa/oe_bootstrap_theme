<div
  aria-label="Detailed offcanvas"
  aria-labelledby="bcl-offcanvas-title"
  class="custom-offcanvas offcanvas-end offcanvas-lg"
  data-bs-scroll="true"
  data-offcanvas="custom-value"
  data-offcanvas-aria-labelledby="bcl-offcanvas-title"
  data-offcanvas-static-role="region"
  id="bcl-offcanvas"
  role="region"
  tabindex="-1"
>
  <div
    class="offcanvas-header"
  >
    <h2
      class="bcl-heading offcanvas-title"
      id="bcl-offcanvas-title"
    >
      <em>
        Linked offcanvas title
      </em>
    </h2>
    <button
      aria-controls="bcl-offcanvas"
      aria-label="Close"
      class="btn-close text-reset"
      data-bs-dismiss="offcanvas"
      data-bs-target="#bcl-offcanvas"
      type="button"
    ></button>
  </div>
  <div
    class="offcanvas-body"
  >
    <strong>
      Rendered body content
    </strong>
  </div>
</div>
<button
  aria-controls="bcl-offcanvas"
  aria-disabled="true"
  class="btn btn-lg btn-outline-secondary custom-toggle gap-2-5"
  data-bs-target="#bcl-offcanvas"
  data-bs-toggle="offcanvas"
  data-toggle="custom-value"
  disabled
  type="button"
>
  <svg
    class="bi custom-toggle-icon icon--fluid icon--rotate-90"
    data-icon="custom-value"
  >
    <use
      xlink:href="/custom-icons.svg#filter"
    ></use>
  </svg>
  Open detailed panel
</button>
