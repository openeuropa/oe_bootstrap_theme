<div
  class="alert alert-danger alert-dismissible align-items-center d-flex fade show text-dark"
  role="alert"
>
  <svg
    class="align-self-start bi flex-shrink-0 icon--s me-3 mt-1 text-danger"
  >
    <use
      xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#lock"
    ></use>
  </svg>
  <div
    class="alert-content flex-grow-1"
  >
    <div
      class="alert-heading h4"
    >
      Well done!
    </div>
    A simple alert. check it out!
  </div>
  <button
    aria-label="Close"
    class="btn-close"
    data-bs-dismiss="alert"
    type="button"
  ></button>
</div>
