<article
  class="card"
>
  <time
    class="bcl-date-block bg-date d-flex flex-column mw-date ratio ratio-1x1 rounded text-center"
  >
    <div
      class="d-flex flex-column pt-2"
    >
      <div
        class="align-item-center bg-white border border-bottom-0 d-flex gap-2 h-100 justify-content-center text-uppercase w-100"
      >
        <div
          class="align-item-center d-flex flex-column justify-content-center"
        >
          <div
            class="date-month lh-1"
          >
            Jan
          </div>
          <div
            class="date-day fs-4 fw-bold lh-1"
          >
            23
          </div>
        </div>
        <div
          class="align-item-center d-flex flex-column justify-content-center"
        >
          <svg
            class="bi icon--xs"
          >
            <use
              xlink:href="#chevron-right"
            ></use>
          </svg>
        </div>
        <div
          class="align-item-center d-flex flex-column justify-content-center"
        >
          <div
            class="date-month lh-1"
          >
            Feb
          </div>
          <div
            class="date-day fs-4 fw-bold lh-1"
          >
            11
          </div>
        </div>
      </div>
      <div
        class="bg-lighter border d-flex gap-4 justify-content-center py-1 rounded-bottom w-100"
      >
        <div
          class="date-year year-start"
        >
          2021
        </div>
        <div
          class="date-year year-end"
        >
          2022
        </div>
      </div>
    </div>
  </time>
  <div
    class="card-body"
  >
    <div
      class="bcl-heading card-title h4"
    >
      Title card
    </div>
  </div>
</article>
