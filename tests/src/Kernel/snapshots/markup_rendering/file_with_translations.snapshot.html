<div
  class="bcl-file-container mt-4"
>
  <h2
    class="bcl-heading mb-4"
  >
    The file title
  </h2>
  <div
    class="bcl-file border rounded"
  >
    <div
      class="px-3-5 py-3"
    >
      <div
        class="d-md-flex"
      >
        <div
          class="pb-2 pe-2"
        >
          <svg
            class="bi icon--2xl icon--file mt-1"
          >
            <use
              xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#file-pdf-fill"
            ></use>
          </svg>
        </div>
        <div
          class="d-md-flex flex-grow-1"
        >
          <div
            class="flex-grow-1"
          >
            <p
              class="fs-5 fw-medium m-0"
            >
              Icon PDF specs
            </p>
            <small
              class="fw-medium m-0"
            >
              English
              <span
                class="fw-normal"
              >

                (22.87 KB - PDF)
              </span>
            </small>
          </div>
          <a
            class="align-self-center d-inline-block flex-shrink-0 mt-1 mt-md-0 standalone"
            download=""
            href="https://example.com/document.pdf"
            target="_blank"
          >
            Download
            <svg
              class="bi icon--fluid ms-2-5"
            >
              <use
                xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#download"
              ></use>
            </svg>
          </a>
        </div>
      </div>
    </div>
    <div
      class="bg-lighter border-top px-4 py-3"
    >
      <div
        class="text-end text-md-center"
      >
        <a
          aria-controls="language-(#*NOISE#0*#)"
          aria-expanded="false"
          class="standalone"
          data-bs-toggle="collapse"
          href="#language-(#*NOISE#0*#)"
          role="button"
        >
          Other languages (3)
          <svg
            class="bi icon--2xs ms-2-5"
          >
            <use
              xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#caret-down-fill"
            ></use>
          </svg>
        </a>
      </div>
      <div
        class="collapse"
        id="language-(#*NOISE#0*#)"
      >
        <div
          class="border-bottom py-3"
        >
          <div
            class="row"
          >
            <div
              class="col-12 col-md-9"
            >
              <p
                class="fw-bold m-0"
              >
                translation_bg.docx
              </p>
              <small
                class="fw-bold m-0"
              >
                български
                <span
                  class="fw-normal"
                >

                  (39.44 KB - DOC)
                </span>
              </small>
            </div>
            <div
              class="align-self-end col-12 col-md-3 text-md-end"
            >
              <a
                class="d-block mt-1 standalone"
                download=""
                href="/translation_bg.docx"
                target="_blank"
              >
                Download
                <svg
                  class="bi icon--fluid ms-2-5"
                >
                  <use
                    xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#download"
                  ></use>
                </svg>
              </a>
            </div>
          </div>
        </div>
        <div
          class="border-bottom py-3"
        >
          <div
            class="row"
          >
            <div
              class="col-12 col-md-9"
            >
              <p
                class="fw-bold m-0"
              >
                translation_es.pdf
              </p>
              <small
                class="fw-bold m-0"
              >
                español
                <span
                  class="fw-normal"
                >

                  (425 bytes - PDF)
                </span>
              </small>
            </div>
            <div
              class="align-self-end col-12 col-md-3 text-md-end"
            >
              <a
                class="d-block mt-1 standalone"
                download=""
                href="/translation_es.html"
                target="_blank"
              >
                Download
                <svg
                  class="bi icon--fluid ms-2-5"
                >
                  <use
                    xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#download"
                  ></use>
                </svg>
              </a>
            </div>
          </div>
        </div>
        <div
          class="pt-3"
        >
          <div
            class="row"
          >
            <div
              class="col-12 col-md-9"
            >
              <p
                class="fw-bold m-0"
              >
                translation_fr.pdf
              </p>
              <small
                class="fw-bold m-0"
              >
                français
                <span
                  class="fw-normal"
                >

                  (121 bytes - PDF)
                </span>
              </small>
            </div>
            <div
              class="align-self-end col-12 col-md-3 text-md-end"
            >
              <a
                class="d-block mt-1 standalone"
                download=""
                href="https://example.com/translation_fr.html"
                target="_blank"
              >
                Download
                <svg
                  class="bi icon--fluid ms-2-5"
                >
                  <use
                    xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#download"
                  ></use>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
