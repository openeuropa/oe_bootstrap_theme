<nav
  aria-label="Search results pages"
  class="pager pager-class pagination-v2"
  data-pager-attribute="pager-attr-value"
  id="pager-id"
>
  <ul
    class="d-flex flex-row js-pager__items justify-content-between justify-content-md-end list-class pager__items pagination pagination-sm"
    data-list-attribute="list-attr-value"
    id="list-id"
  >
    <li
      class="d-inline-block page-item pager__item pager__item--prev"
    >
      <a
        aria-hidden="false"
        aria-label="Previous"
        class="page-link"
        href="#prev"
      >
        Previous
      </a>
    </li>
    <li
      class="d-md-inline-block d-none page-item pager__item"
    >
      <a
        aria-hidden="false"
        aria-label="First"
        class="page-link"
        href="#first"
      >
        First
      </a>
    </li>
    <li
      class="d-md-inline-block d-none page-item pager__item"
    >
      <a
        aria-hidden="false"
        aria-label="1"
        class="page-link"
        href="#1"
      >
        1
      </a>
    </li>
    <li
      class="active d-inline-block page-item pager__item"
    >
      <div
        aria-current="page"
        aria-label="2"
        class="page-link"
        tabindex="0"
      >
        <span
          class="d-inline-block"
        >
          2
        </span>
      </div>
    </li>
    <li
      class="d-md-inline-block d-none disabled page-item pager__item"
    >
      <a
        aria-disabled="true"
        aria-hidden="false"
        aria-label="3"
        class="disabled page-link"
        href="#3"
        tabindex="-1"
      >
        3
      </a>
    </li>
    <li
      class="d-md-inline-block d-none page-item pager__item"
    >
      <a
        aria-hidden="false"
        aria-label="Last"
        class="page-link"
        href="#last"
      >
        Last
      </a>
    </li>
    <li
      class="d-inline-block page-item pager__item pager__item--next"
    >
      <a
        aria-hidden="false"
        aria-label="Next"
        class="page-link"
        href="#next"
      >
        Next
      </a>
    </li>
  </ul>
</nav>
