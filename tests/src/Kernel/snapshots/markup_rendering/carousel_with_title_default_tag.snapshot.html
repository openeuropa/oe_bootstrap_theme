<h2
  class="bcl-heading mb-4"
>
  Carousel title
</h2>
<div
  class="carousel slide"
  data-bs-ride="carousel"
  id="bcl-carousel"
>
  <div
    class="carousel-inner"
  ></div>
  <button
    class="carousel-control-prev"
    data-bs-slide="prev"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-prev-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Previous
    </span>
  </button>
  <button
    class="carousel-control-next"
    data-bs-slide="next"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-next-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Next
    </span>
  </button>
</div>
