<article
  class="card"
>
  <div
    class="card-header"
  >
    Header of card
  </div>
  <div
    class="g-0 row"
  >
    <div
      class="col-4"
    >
      <figure
        class="bcl-card__image-wrapper m-0"
      >
        <img
          alt="Alternative text for card image"
          class="card-img-top rounded-0 rounded-start"
          src="https://picsum.photos/1000/500/"
        />
      </figure>
    </div>
    <div
      class="col-8"
    >
      <div
        class="card-body"
      >
        <h2
          class="bcl-heading card-title h4"
        >
          Title card
        </h2>
        <h6
          class="card-subtitle"
        >
          Subtitle card
        </h6>
        <div
          class="card-text mt-2"
        >
          Text card with longer text which is supported
        </div>
        <div
          class="me-n3 mt-3"
        >
          <span
            class="me-3 text-muted"
          >
            DIGIT
          </span>
          <span
            class="me-3 text-muted"
          >
            Developer
          </span>
        </div>
        <div
          class="mt-3"
        >
          <button
            class="btn btn-md btn-primary"
            type="button"
          >
            Custom action
          </button>
        </div>
      </div>
    </div>
  </div>
  <div
    class="card-footer"
  >
    Footer of card
  </div>
</article>
