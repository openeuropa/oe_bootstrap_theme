<article
  class="card"
>
  <figure
    class="bcl-card__image-wrapper m-0"
  >
    <img
      alt="Alternative text for card image"
      class="card-img-top"
      src="https://picsum.photos/1000/500/"
    />
    <figcaption
      class="bcl-card__image-footer"
    >
      <div
        class="bcl-copyright"
      >
        <span
          class="visually-hidden"
        >
          Image credit:

        </span>
        © 2024 Example Organisation
      </div>
    </figcaption>
  </figure>
  <div
    class="card-body"
  >
    <div
      class="bcl-heading card-title h4"
    >
      Title card
    </div>
    <div
      class="card-text mt-2"
    >
      Text card with longer text which is supported
    </div>
  </div>
</article>
