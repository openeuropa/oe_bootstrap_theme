<section
  aria-label="Featured priorities"
  aria-roledescription="carusel"
  class="bcl-carousel-v2 bcl-carousel-v2--split carousel carousel-fade custom-carousel-v2 slide"
  data-bcl-autoplay="true"
  data-bcl-pause-on-hover="false"
  data-bs-interval="12000"
  data-bs-pause="false"
  data-bs-ride="false"
  data-bs-touch="false"
  data-carousel="custom-value"
  id="custom-carousel-v2"
  role="region"
>
  <div
    class="bcl-carousel-v2__controls"
    hidden
  >
    <button
      aria-controls="custom-carousel-v2-slides"
      aria-label="Redă"
      class="bcl-carousel-v2__control btn btn-outline-primary"
      data-bcl-pause-label="Pauză"
      data-bcl-play-label="Redă"
      data-bcl-rotation=""
      type="button"
    >
      <span
        aria-hidden="true"
        data-bcl-play-icon=""
      >
        <svg
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#play-fill"
          ></use>
        </svg>
      </span>
      <span
        aria-hidden="true"
        data-bcl-pause-icon=""
        hidden
      >
        <svg
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#pause-fill"
          ></use>
        </svg>
      </span>
    </button>
    <div
      class="bcl-carousel-v2__navigation"
    >
      <button
        aria-controls="custom-carousel-v2-slides"
        aria-label="Anterior"
        class="bcl-carousel-v2__control btn btn-outline-primary"
        data-bs-slide="prev"
        data-bs-target="#custom-carousel-v2"
        type="button"
      >
        <svg
          aria-hidden="true"
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#chevron-left"
          ></use>
        </svg>
      </button>
      <button
        aria-controls="custom-carousel-v2-slides"
        aria-label="Următor"
        class="bcl-carousel-v2__control btn btn-outline-primary"
        data-bs-slide="next"
        data-bs-target="#custom-carousel-v2"
        type="button"
      >
        <svg
          aria-hidden="true"
          class="bi icon--s"
        >
          <use
            xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#chevron-right"
          ></use>
        </svg>
      </button>
      <span
        aria-hidden="true"
        class="bcl-carousel-v2__counter"
      >
        <span
          data-bcl-current=""
        >
          2
        </span>
        /
        <span>
          2
        </span>
      </span>
    </div>
  </div>
  <div
    aria-live="off"
    class="carousel-inner"
    id="custom-carousel-v2-slides"
  >
    <div
      aria-label="First slide title — 1 din 2"
      aria-roledescription="diapozitiv"
      class="carousel-item"
      data-bs-interval="16000"
      role="group"
    >
      <div
        class="bcl-carousel-v2__layout"
      >
        <div
          class="bcl-carousel-v2__image"
        >
          <span
            aria-hidden="true"
            class="bcl-carousel-v2__progress"
            hidden
          ></span>

          <img
            alt="alt image 1"
            class="object-fit-cover"
            height="600"
            loading="lazy"
            src="https://images.site.example/1"
            title="Image title"
            width="1200"
          />
        </div>
        <div
          class="bcl-carousel-v2__copyright"
        >
          <span
            class="visually-hidden"
          >
            Custom credit:

          </span>
          © 2026 Example Organisation
        </div>
        <div
          class="bcl-carousel-v2__content"
        >
          <h4
            class="bcl-carousel-v2__title"
          >
            First slide title
          </h4>
          <div
            class="bcl-carousel-v2__description"
          >
            First slide caption
          </div>
          <a
            class="btn btn-primary custom-link-class"
            href="https://link.one"
          >
            First link
            <svg
              class="bi icon--s ms-2-5"
            >
              <use
                xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#chevron-right"
              ></use>
            </svg>
          </a>
        </div>
      </div>
    </div>
    <div
      aria-label="Second slide title — 2 din 2"
      aria-roledescription="diapozitiv"
      class="active carousel-item"
      role="group"
    >
      <div
        class="bcl-carousel-v2__layout"
      >
        <div
          class="bcl-carousel-v2__image"
        >
          <span
            aria-hidden="true"
            class="bcl-carousel-v2__progress"
            hidden
          ></span>
          <picture>
            <source
              media="(min-width: 992px)"
              srcset="large.webp"
            >
              <img
                alt="Second slide image"
                height="300"
                src="small.jpg"
                width="600"
              />
            </source>
          </picture>
        </div>
        <div
          class="bcl-carousel-v2__content"
        >
          <h4
            class="bcl-carousel-v2__title"
          >
            Second slide title
          </h4>
        </div>
      </div>
    </div>
  </div>
</section>
