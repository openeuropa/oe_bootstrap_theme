<div
  class="bcl-featured-media"
>
  <h2
    class="bcl-heading mb-4"
  >
    Embedded featured media
  </h2>
  <div
    class="row"
  >
    <div
      class="col-12 col-md-6 order-2"
    >
      <h3
        class="text-secondary"
      >
        Supporting subtitle
      </h3>
      Text displayed on the right.
    </div>
    <div
      class="col-12 col-md-6 order-1"
    >
      <figure
        class="overflow-hidden rounded"
      >
        <div
          class="ratio ratio-21x9"
        >
          <iframe
            src="https://example.com/embed"
            title="Embedded media"
          ></iframe>
        </div>
        <figcaption>
          <div
            class="bg-light p-3"
          >
            Embedded media caption.
          </div>
          <div
            class="bcl-copyright"
          >
            <span
              class="visually-hidden"
            >
              Copyright:

            </span>
            © 2026 Example Organisation
          </div>
        </figcaption>
      </figure>
    </div>
  </div>
</div>
