<div
  class="bcl-links-block custom-links-block"
  data-block-attribute="custom-value"
  id="custom-links-block"
>
  <h3
    class="bcl-heading border-bottom mb-3 pb-3"
  >
    Related

    <em>
      information
    </em>
  </h3>
  <ul
    class="mb-0 ps-0"
  >
    <li
      class="d-inline list-unstyled me-4-5"
    >
      <a
        aria-disabled="true"
        class="custom-link d-flex d-inline-block disabled gap-2-5 link-warning mb-3 standalone"
        data-link-attribute="custom-value"
        href="/disabled"
        id="disabled-link"
        tabindex="-1"
      >
        <svg
          class="bi icon--s"
        >
          <use
            xlink:href="#lock"
          ></use>
        </svg>
        Disabled

        <strong>
          link
        </strong>
      </a>
    </li>
    <li
      class="d-inline list-unstyled me-4-5"
    >
      <a
        class="d-inline-block d-inline-flex gap-2-5 mb-3 standalone"
        href="/custom-icon"
      >
        Custom icon
        <svg
          class="bi custom-link-icon icon--flip-vertical icon--xl"
        >
          <use
            xlink:href="/other/icons.svg#custom-symbol"
          ></use>
        </svg>
      </a>
    </li>
    <li
      class="d-inline list-unstyled"
    >
      <a
        class="d-inline-block mb-3 standalone"
        href="/no-spacing"
      >
        No icon spacing
        <svg
          class="bi icon--s"
        >
          <use
            xlink:href="#arrow-right"
          ></use>
        </svg>
      </a>
    </li>
  </ul>
</div>
