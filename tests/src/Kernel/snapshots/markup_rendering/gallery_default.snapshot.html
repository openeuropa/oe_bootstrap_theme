<div
  class="bcl-gallery"
>
  <div
    class="bcl-gallery__thumbnails"
  >
    <ul
      class="bcl-gallery__grid"
    >
      <li>
        <a
          class="bcl-gallery__item d-block img-fluid w-100"
          data-bs-slide-to="0"
          data-bs-target="#carouselBcl-gallery"
          tabindex="0"
        >
          <div
            class="bcl-gallery__item-overlay"
            data-bs-target="#modalBcl-gallery"
            data-bs-toggle="modal"
          >
            <span
              class="bcl-gallery__item-play-icon"
            >
              <svg
                class="bi icon--s"
              >
                <use
                  xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#play-fill"
                ></use>
              </svg>
            </span>
            <div
              class="bcl-gallery__item-caption"
            >
              <div
                class="fs-5"
              >
                Bio-defence preparedness programme
              </div>
              <div
                class="bcl-gallery__item-description"
              >
                Caption first item
              </div>
            </div>
          </div>
          <img
            alt="Example alt text"
            src="https://inno-ecl.s3.amazonaws.com/media/examples/example-external-video.jpg"
          />
        </a>
      </li>
      <li>
        <a
          class="bcl-gallery__item d-block img-fluid w-100"
          data-bs-slide-to="1"
          data-bs-target="#carouselBcl-gallery"
          tabindex="0"
        >
          <div
            class="bcl-gallery__item-overlay"
            data-bs-target="#modalBcl-gallery"
            data-bs-toggle="modal"
          >
            <div
              class="bcl-gallery__item-caption"
            >
              <div
                class="fs-5"
              >
                A picture of a cat
              </div>
              <div
                class="bcl-gallery__item-description"
              >
                Caption second item
              </div>
            </div>
          </div>
          <img
            alt="Cat thumbnail alt"
            src="https://picsum.photos/id/10/400/300/"
          />
        </a>
      </li>
      <li>
        <a
          class="bcl-gallery__item d-block img-fluid w-100"
          data-bs-slide-to="2"
          data-bs-target="#carouselBcl-gallery"
          tabindex="0"
        >
          <div
            class="bcl-gallery__item-overlay"
            data-bs-target="#modalBcl-gallery"
            data-bs-toggle="modal"
          >
            <div
              class="bcl-gallery__item-caption"
            >
              <div
                class="fs-5"
              >
                An image of a dog.
              </div>
            </div>
          </div>
          <img
            alt="Dog thumbnail alt"
            src="https://picsum.photos/id/11/400/300/"
          />
        </a>
      </li>
      <li>
        <a
          class="bcl-gallery__item d-block img-fluid w-100"
          data-bs-slide-to="3"
          data-bs-target="#carouselBcl-gallery"
          tabindex="0"
        >
          <div
            class="bcl-gallery__item-overlay"
            data-bs-target="#modalBcl-gallery"
            data-bs-toggle="modal"
          >
            <span
              class="bcl-gallery__item-play-icon"
            >
              <svg
                class="bi icon--s"
              >
                <use
                  xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#play-fill"
                ></use>
              </svg>
            </span>
            <div
              class="bcl-gallery__item-caption"
            >
              <div
                class="fs-5"
              >
                Safer electric vehicles - through harmonised test procedures for battery technology
              </div>
              <div
                class="bcl-gallery__item-description"
              >
                Iframe caption.
              </div>
            </div>
          </div>
          <img
            alt="YouTube thumbnail alt"
            src="https://picsum.photos/id/12/400/300"
          />
        </a>
      </li>
    </ul>
  </div>
  <div
    aria-hidden="true"
    aria-labelledby="modalBcl-gallery"
    class="modal"
    data-bs-backdrop="false"
    id="modalBcl-gallery"
    tabindex="-1"
  >
    <div
      class="modal-dialog modal-dialog-centered modal-fullscreen"
    >
      <div
        class="modal-content"
      >
        <div
          class="border-0 justify-content-between modal-header"
        >
          <div
            class="carousel-pager"
          >
            <span>
              1
            </span>

            / 4
          </div>
          <div
            class="modal-close"
          >
            <button
              aria-label="Close"
              class="btn-close"
              data-bs-dismiss="modal"
              type="button"
            ></button>
          </div>
        </div>
        <div
          class="align-items-center d-flex justify-content-center modal-body"
        >
          <div
            class="carousel slide"
            id="carouselBcl-gallery"
          >
            <div
              class="carousel-inner"
            >
              <div
                class="active carousel-item"
              >
                <figure
                  class="h-100 m-0"
                >
                  <video
                    controls
                    poster="https://inno-ecl.s3.amazonaws.com/media/examples/example-external-video.jpg"
                  >
                    <source
                      src="https://inno-ecl.s3.amazonaws.com/media/videos/big_buck_bunny.mp4"
                      type="video/mp4"
                    />
                  </video>
                </figure>
              </div>
              <div
                class="carousel-item"
              >
                <figure
                  class="h-100 m-0"
                >
                  <img
                    alt="Cat media image alt"
                    data-src="https://picsum.photos/id/10/800/600/"
                  />
                  <div
                    class="carousel-caption d-md-block d-none"
                  >
                    <div
                      class="fs-5"
                    >
                      A picture of a cat
                    </div>
                    Caption second item
                  </div>
                </figure>
              </div>
              <div
                class="carousel-item"
              >
                <figure
                  class="h-100 m-0"
                >
                  <img
                    alt="Dog image media alt"
                    class="img-fluid"
                    data-src="https://picsum.photos/id/11/800/600/"
                    title="Dog image media title"
                  />
                  <div
                    class="carousel-caption"
                  >
                    <div
                      class="fs-5"
                    >
                      An image of a dog.
                    </div>
                  </div>
                </figure>
              </div>
              <div
                class="carousel-item"
              >
                <figure
                  class="h-100 m-0"
                >
                  <iframe
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                    caption_title="YouTube video player"
                    data-src="https://www.youtube.com/embed/Ty5axPlgMuk"
                    frameborder="0"
                    height="315"
                    width="560"
                  ></iframe>
                </figure>
              </div>
            </div>
            <button
              class="carousel-control-prev"
              data-bs-slide="prev"
              data-bs-target="#carouselBcl-gallery"
              type="button"
            >
              <span
                class="carousel-control-prev-icon"
              ></span>
              <span
                class="visually-hidden"
              >
                Previous
              </span>
            </button>
            <button
              class="carousel-control-next"
              data-bs-slide="next"
              data-bs-target="#carouselBcl-gallery"
              type="button"
            >
              <span
                class="carousel-control-next-icon"
              ></span>
              <span
                class="visually-hidden"
              >
                Next
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
