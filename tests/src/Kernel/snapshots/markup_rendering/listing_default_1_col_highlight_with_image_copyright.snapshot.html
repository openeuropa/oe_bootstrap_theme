<div
  class="bcl-listing bcl-listing--highlight-1-col text-break"
>
  <h2
    class="bcl-heading mb-4"
  >
    Listing item block title
  </h2>
  <div
    class="g-4 row row-cols-1"
  >
    <div
      class="col mt-4-5"
    >
      <article
        class="bg-lighter border-0 card listing-item--highlight"
      >
        <figure
          class="bcl-card__image-wrapper m-0"
        >
          <img
            alt="alt img"
            class="card-img-top"
            src="https://picsum.photos/600/400/"
          />
          <figcaption
            class="bcl-card__image-footer"
          >
            <div
              class="bcl-copyright"
            >
              <span
                class="visually-hidden"
              >
                Image credit:

              </span>
              © 2024 Example Organisation
            </div>
          </figcaption>
        </figure>
        <div
          class="card-body pt-3"
        >
          <div
            class="bcl-heading card-title h5"
          >
            Card title 1
          </div>
          <div
            class="card-text mb-2"
          >
            Lorem ipsum dolor sit amet.
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
