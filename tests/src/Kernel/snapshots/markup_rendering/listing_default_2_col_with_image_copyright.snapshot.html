<div
  class="bcl-listing bcl-listing--default-2-col text-break"
>
  <h2
    class="bcl-heading mb-4"
  >
    Listing item block title
  </h2>
  <div
    class="g-4 row row-cols-1 row-cols-md-2"
  >
    <div
      class="col"
    >
      <article
        class="border-0 border-bottom border-md-0 card listing-item"
      >
        <div
          class="row"
        >
          <div
            class="bcl-card-start-col mb-3 mb-lg-0"
          >
            <figure
              class="bcl-card__image-wrapper m-0"
            >
              <img
                alt="alt img"
                class="card-img-top rounded-top-1"
                src="https://picsum.photos/600/400/"
              />
              <figcaption
                class="bcl-card__image-footer"
              >
                <div
                  class="bcl-copyright"
                >
                  <span
                    class="visually-hidden"
                  >
                    Image credit:

                  </span>
                  © 2024 Example Organisation
                </div>
              </figcaption>
            </figure>
          </div>
          <div
            class="col-12 col-md"
          >
            <div
              class="card-body p-0 pb-3 pb-md-0"
            >
              <div
                class="bcl-heading card-title h5"
              >
                Card title 1
              </div>
              <div
                class="card-text mb-2"
              >
                Lorem ipsum dolor sit amet.
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
