<h4
  class="bcl-heading mb-4"
>
  Carousel title
</h4>
<div
  class="carousel slide"
  data-bs-ride="carousel"
  id="bcl-carousel"
>
  <div
    class="carousel-inner"
  >
    <div
      class="active carousel-item"
      data-bs-interval="1"
    >
      <figure
        class="h-100 m-0"
      >
        <img
          alt="alt image 1"
          class="d-block w-100"
          src="https://images.site.example1"
        />
        <div
          class="carousel-caption"
        >
          <div
            class="caption_classes-1"
          >
            <div
              class="fs-5"
            >
              First slide title
            </div>
            First slide caption
          </div>
          <a
            href="https://link.one"
          >
            <svg
              class="bi icon--s me-2-5"
            >
              <use
                xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#link"
              ></use>
            </svg>
            First link
          </a>
        </div>
      </figure>
    </div>
    <div
      class="carousel-item"
      data-bs-interval="2"
    >
      <figure
        class="h-100 m-0"
      >
        <img
          alt="alt image 2"
          class="d-block w-100"
          src="https://images.site.example2"
        />
        <div
          class="carousel-caption"
        >
          <div
            class="caption_classes-2"
          >
            <div
              class="fs-5"
            >
              Second slide title
            </div>
            Second slide caption
          </div>
          <a
            href="https://link.two"
          >
            <svg
              class="bi icon--s me-2-5"
            >
              <use
                xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#link"
              ></use>
            </svg>
            Second link
          </a>
        </div>
      </figure>
    </div>
  </div>
  <button
    class="carousel-control-prev"
    data-bs-slide="prev"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-prev-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Previous
    </span>
  </button>
  <button
    class="carousel-control-next"
    data-bs-slide="next"
    data-bs-target="#bcl-carousel"
    type="button"
  >
    <span
      class="carousel-control-next-icon"
    ></span>
    <span
      class="visually-hidden"
    >
      Next
    </span>
  </button>
</div>
