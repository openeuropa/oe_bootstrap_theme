<div
  class="card card-class horizontal v2"
  data-card-attribute="card-attr-value"
  id="card-id"
>
  <div
    class="card-media media-class"
    data-media-attribute="media-attr-value"
    id="media-id"
  >
    <img
      alt="Alternative text for card image"
      src="https://picsum.photos/1000/500/"
    />
  </div>
  <div
    class="card-header header-class"
    data-header-attribute="header-attr-value"
    id="header-id"
  >
    <p>
      Header content card
    </p>
  </div>
  <div
    class="card-body content-class"
    data-content-attribute="content-attr-value"
    id="content-id"
  >
    <div
      class="card-title"
    >
      New title with

      <b>
        markup
      </b>
    </div>
    <p>
      Body content card
    </p>
  </div>
  <div
    class="card-footer footer-class"
    data-footer-attribute="footer-attr-value"
    id="footer-id"
  >
    <p>
      Footer content card
    </p>
  </div>
</div>
