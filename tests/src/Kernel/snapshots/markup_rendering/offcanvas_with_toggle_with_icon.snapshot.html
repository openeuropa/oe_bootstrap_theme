<div
  aria-labelledby="bcl-offcanvas-title"
  class="offcanvas-lg offcanvas-top"
  data-offcanvas-aria-labelledby="bcl-offcanvas-title"
  data-offcanvas-static-role="region"
  id="bcl-offcanvas"
  role="region"
  tabindex="-1"
>
  <div
    class="offcanvas-header"
  >
    <h2
      class="bcl-heading offcanvas-title"
      id="bcl-offcanvas-title"
    >
      Offcanvas title
    </h2>
    <button
      aria-controls="bcl-offcanvas"
      aria-label="Close"
      class="btn-close text-reset"
      data-bs-dismiss="offcanvas"
      data-bs-target="#bcl-offcanvas"
      type="button"
    ></button>
  </div>
  <div
    class="offcanvas-body"
  >
    This is the offcanvas body content.
  </div>
</div>
<button
  aria-controls="bcl-offcanvas"
  class="btn btn-md btn-primary gap-2-5"
  data-bs-target="#bcl-offcanvas"
  data-bs-toggle="offcanvas"
  type="button"
>
  Toggle offcanvas
  <svg
    class="bi icon--fluid"
  >
    <use
      xlink:href="/themes/custom/oe_bootstrap_theme/assets/icons/bcl-default-icons.svg#filter"
    ></use>
  </svg>
</button>
