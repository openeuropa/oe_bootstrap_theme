date_block_default:
  render:
    '#type': pattern
    '#id': date_block
    '#fields':
      date: '2021-05-26'
  assertions:
    count:
      # Exclude unexpected additional <time> elements.
      'time': 1
      'time.bcl-date-block[datetime="2021-05-26"]': 1
    equals:
      'time > div > div > div:nth-child(1) .date-month': 'May'
      'time > div > div > div:nth-child(1) .date-day': '26'
      'time > div > div:nth-child(2) .year-start': '2021'
