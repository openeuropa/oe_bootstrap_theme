copyright_wrapper_default:
  render:
    '#type': pattern
    '#id': copyright_wrapper
    '#fields':
      content:
        '#markup': '<img src="https://picsum.photos/800/450" alt="Sample image">'
      copyright: 'Copyright 2024 Example Organisation'
  assertions:
    count:
      'div.media-container': 1
      'div.media-container img': 1
      'div.media-container .copyright-overlay': 1
    contains:
      '.copyright-overlay span.copyright-preview': 'Copyright 2024 Example Organisation'
      '.copyright-overlay .copyright-trigger': 'View more'
copyright_wrapper_with_custom_settings:
  render:
    '#type': pattern
    '#id': copyright_wrapper
    '#fields':
      content:
        '#markup': '<video controls><source src="movie.mp4" type="video/mp4"></video>'
      copyright:
        content:
          '#markup': 'Copyright 2024 Example Organisation'
        trigger_label: 'Licence'
        modal_title: 'Usage rights'
    '#settings':
      tag: section
      attributes: 'class="media-container--custom" data-component="media-container"'
  assertions:
    count:
      'section.media-container.media-container--custom': 1
      'section[data-component="media-container"]': 1
      'section video': 1
      'section .copyright-overlay': 1
      'div#bcl-copyright-modal .modal-header h5': 1
    contains:
      'section .copyright-overlay .copyright-trigger': 'Licence'
      'div#bcl-copyright-modal .modal-header h5': 'Usage rights'
copyright_wrapper_without_copyright:
  render:
    '#type': pattern
    '#id': copyright_wrapper
    '#fields':
      content:
        '#markup': '<img src="https://picsum.photos/400/300" alt="Another image">'
  assertions:
    count:
      'div.media-container': 1
      'div.media-container img': 1
      '.copyright-overlay': 0
