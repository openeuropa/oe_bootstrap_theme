copyright_overlay:
  render:
    '#type': pattern
    '#id': copyright_overlay
    '#fields':
      content: 'Default ipsum dolor sit amet.'
  assertions:
    contains:
      '.copyright-overlay': 'Default ipsum dolor sit amet.'
    count:
      '.copyright-overlay': 1
      '.copyright-trigger': 0
      '.modal': 0
copyright_overlay_with_custom_trigger_label:
  render:
    '#type': pattern
    '#id': copyright_overlay
    '#fields':
      content: 'Lorem Ipsum dolor sit amet'
  assertions:
    contains:
      '.copyright-overlay': 'Lorem Ipsum dolor sit amet'
    count:
      '.copyright-overlay': 1
      '.copyright-trigger': 0
      '.modal': 0
copyright_overlay_with_custom_modal_title:
  render:
    '#type': pattern
    '#id': copyright_overlay
    '#fields':
      content: 'Aenean eget accumsan neque, eu accumsan eros.'
  assertions:
    contains:
      '.copyright-overlay': 'Aenean eget accumsan neque, eu accumsan eros.'
    count:
      '.copyright-overlay': 1
      '.copyright-trigger': 0
      '.modal': 0
copyright_overlay_with_attributes:
  render:
    '#type': pattern
    '#id': copyright_overlay
    '#fields':
      content: 'Pellentesque ullamcorper erat sed arcu dapibus.'
    '#settings':
      attributes: 'class="test-class" id="test-id" data-test="attr-value"'
  assertions:
    contains:
      '.copyright-overlay': 'Pellentesque ullamcorper erat sed arcu dapibus.'
    count:
      '.copyright-overlay': 1
      '.copyright-overlay.test-class': 1
      '.copyright-overlay#test-id': 1
      '.copyright-overlay[data-test="attr-value"]': 1
      '.copyright-trigger': 0
      '.modal': 0
