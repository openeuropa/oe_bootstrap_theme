      'nav.bg-light': 1
      'nav.navbar-light': 1
      'nav.bg-dark': 0
      'nav.navbar-dark': 0
      'nav.navbar-expand-sm': 0
      'nav.navbar-expand-md': 0
      'nav.navbar-expand-lg': 1
      'button.navbar-toggler': 1
