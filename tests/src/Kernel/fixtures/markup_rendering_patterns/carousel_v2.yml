carousel_v2_custom_icon_path:
  render:
    '#type': pattern
    '#id': carousel_v2
    '#fields':
      items:
      - image:
          src: https://images.site.example/1
          alt: alt image 1
        caption_title: First slide title
        link:
          label: Read more
          path: https://link.one
      - image:
          src: https://images.site.example/2
          alt: alt image 2
        caption_title: Second slide title
    '#settings':
      icon_path: /custom-icons.svg
  assertions:
    count:
      '[data-bcl-play-icon] svg': 1
      '[data-bcl-pause-icon] svg': 1
      '[data-bs-slide="prev"] svg': 1
      '[data-bs-slide="next"] svg': 1
      .bcl-carousel-v2__content a svg: 1
    contains:
      '[data-bcl-play-icon] svg': /custom-icons.svg#play-fill
      '[data-bcl-pause-icon] svg': /custom-icons.svg#pause-fill
      '[data-bs-slide="prev"] svg': /custom-icons.svg#chevron-left
      '[data-bs-slide="next"] svg': /custom-icons.svg#chevron-right
      .bcl-carousel-v2__content a svg: /custom-icons.svg#chevron-right
