carousel_with_all_settings:
  render:
    '#type': pattern
    '#id': carousel
    '#fields':
      settings:
        fade: true
        show_controls: true
        show_indicators: true
        autoplay: true
        # Removed setting 'autoinit' must be ignored, if passed anyway.
        autoinit: false
        disable_touch: true
      slides:
        - caption: 'First slide caption'
          caption_title: 'First slide title'
          interval: 0
          image:
            src: 'https://images.site.example1'
            alt: 'alt image 1'
  assertions:
    pattern:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\CarouselPatternAssert
      expected:
        title: ~
        settings:
          fade: true
          show_controls: true
          show_indicators: true
          autoplay: true
          disable_touch: true
        items:
          - image: '<img src="https://images.site.example1" alt="alt image 1" class="d-block w-100">'
            caption_title: 'First slide title'
            caption: 'First slide caption'
