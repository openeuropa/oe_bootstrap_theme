file_with_translations:
  render:
    '#type': pattern
    '#id': file
    '#fields':
      title: 'The file title'
      file: !FileValueObject
        title: 'Icon PDF specs'
        name: 'druplicon.pdf'
        url: 'https://example.com/document.pdf'
        mime: 'application/pdf'
        size: '23423'
        language_code: 'en'
      translations:
        - !FileValueObject
          language_code: 'bg'
          name: 'translation_bg.docx'
          mime: 'application/msword'
          size: '40391'
          url: '/translation_bg.docx'
        - !FileValueObject
          language_code: 'es'
          name: 'translation_es.pdf'
          mime: 'application/pdf'
          size: '425'
          url: '/translation_es.html'
        - !FileValueObject
          language_code: 'fr'
          name: 'translation_fr.pdf'
          mime: 'application/pdf'
          size: '121'
          url: 'https://example.com/translation_fr.html'
  assertions:
    pattern:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\FilePatternAssert
      expected:
        title: 'The file title'
        title_tag: 'h2'
        file:
          title: 'Icon PDF specs'
          language: 'English'
          url: 'https://example.com/document.pdf'
          meta: '(22.87 KB - PDF)'
          icon: 'file-pdf-fill'
        translations:
          - title: 'translation_bg.docx'
            language: 'български'
            url: '/translation_bg.docx'
            meta: '(39.44 KB - DOC)'
          - title: 'translation_es.pdf'
            language: 'español'
            url: '/translation_es.html'
            meta: '(425 bytes - PDF)'
          - title: 'translation_fr.pdf'
            language: 'français'
            url: 'https://example.com/translation_fr.html'
            meta: '(121 bytes - PDF)'
        link_label: 'Download'
file_without_translations_without_title:
  render:
    '#type': pattern
    '#id': file
    '#fields':
      file: !FileValueObject
        title: 'Foglio di calcolo'
        name: 'calculations.xls'
        url: 'https://example.com/document.pdf'
        mime: 'application/msexcel'
        size: '40319401'
        language_code: 'it'
      link_label: 'Scarica'
  assertions:
    pattern:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\FilePatternAssert
      expected:
        title: ~
        file:
          title: 'Foglio di calcolo'
          language: 'italiano'
          url: 'https://example.com/document.pdf'
          meta: '(38.45 MB - XLS)'
          icon: 'file-excel-fill'
        translations: ~
        link_label: 'Scarica'
file_with_title_tag:
  render:
    '#type': pattern
    '#id': file
    '#fields':
      title: 'The file title'
      title_tag: 'h4'
      file: !FileValueObject
        title: 'Icon PDF specs'
        name: 'druplicon.pdf'
        url: 'https://example.com/document.pdf'
        mime: 'application/pdf'
        size: '23423'
        language_code: 'en'
  assertions:
    pattern:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\FilePatternAssert
      expected:
        title: 'The file title'
        title_tag: 'h4'
        file:
          title: 'Icon PDF specs'
          language: 'English'
          url: 'https://example.com/document.pdf'
          meta: '(22.87 KB - PDF)'
          icon: 'file-pdf-fill'
        translations: ~
        link_label: 'Download'
# Custom link label with translations. The first translation has no size.
file_with_translations_and_custom_link_label:
  render:
    '#type': 'pattern'
    '#id': 'file'
    '#fields':
      link_label: 'Get the file'
      file:
        title: 'Example document'
        url: 'https://example.com/document.pdf'
        extension: 'pdf'
        language_code: 'en'
      translations:
        - title: 'Exemple de document'
          url: 'https://example.com/document-fr.pdf'
          size: 4321
          extension: 'pdf'
          language_code: 'fr'
        - title: 'Пример документ'
          url: 'https://example.com/document-bg.docx'
          size: 40391
          extension: 'docx'
          language_code: 'bg'
          meta: 'Draft'
  assertions: {}
# Without a file, nothing is rendered, even with a title.
file_without_file_renders_nothing:
  render:
    '#type': 'pattern'
    '#id': 'file'
    '#fields':
      title: 'Should not render body'
  assertions: {}
# Empty extension, as returned by FileValueObject::getExtension() if no
# extension can be determined.
file_empty_extension:
  render:
    '#type': 'pattern'
    '#id': 'file'
    '#fields':
      file:
        title: 'Report'
        url: '/report'
        extension: ''
        language_code: 'en'
  assertions: {}
