content_banner_white_with_all_content:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:content_banner
    '#props':
      background: white
      meta:
        - '26 May 2020'
        - '1 comment'
      image:
        src: 'https://picsum.photos/1200/600/'
        alt: 'Alternative text for content banner image'
      title: 'This is the title of this page'
      title_tag: h2
      action_bar:
        - '#markup': '<div class="action-bar d-flex justify-content-end mt-2 align-items-center col-lg-11"><a href="#" class="standalone" type="button">Submit</a></div>'
      content: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse volutpat ultricies massa, a dapibus libero porta nec.'
      badges:
        - label: 'Primary badge'
          rounded_pill: true
          outline: false
        - label: 'Secondary badge'
          rounded_pill: true
      links:
        - label: 'Link 1'
          path: 'https://example-1.com'
        - label: 'Link 2'
          path: 'https://example-2.com'
  assertions:
    component:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\ContentBannerAssert
      expected:
        background: white
        meta:
          - '26 May 2020'
          - '1 comment'
        image:
          src: 'https://picsum.photos/1200/600/'
          alt: 'Alternative text for content banner image'
        title: 'This is the title of this page'
        title_tag: h2
        action_bar: '<div class="position-relative z-1"><div class="action-bar d-flex justify-content-end mt-2 align-items-center col-lg-11"><a href="#" class="standalone" type="button">Submit</a></div></div>'
        content: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse volutpat ultricies massa, a dapibus libero porta nec.'
        badges:
          - label: 'Primary badge'
            rounded_pill: true
            outline: false
          - label: 'Secondary badge'
            rounded_pill: true
        links:
          - label: 'Link 1'
            path: 'https://example-1.com'
          - label: 'Link 2'
            path: 'https://example-2.com'
