columns_default:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:columns
    '#props':
      items:
        - '#plain_text': Column 1
        - '#plain_text': Column 2
        - '#plain_text': Column 3
        - '#plain_text': Column 4
        - '#plain_text': Column 5
        - '#plain_text': Column 6
  assertions:
    count:
      'div[data-component-id="oe_bootstrap_theme:columns"].columns': 1
      'div[data-component-id="oe_bootstrap_theme:columns"][style="--columns-grid--column-count: 4;"]': 1
      'div[data-component-id="oe_bootstrap_theme:columns"] > .columns__item': 6
    equals:
      'div[data-component-id="oe_bootstrap_theme:columns"] > .columns__item:nth-child(1)': 'Column 1'
      'div[data-component-id="oe_bootstrap_theme:columns"] > .columns__item:nth-child(6)': 'Column 6'
columns_three_cols:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:columns
    '#props':
      items:
        - '#plain_text': Column 1
        - '#plain_text': Column 2
        - '#plain_text': Column 3
        - '#plain_text': Column 4
        - '#plain_text': Column 5
        - '#plain_text': Column 6
      columns: 3
  assertions:
    count:
      'div[data-component-id="oe_bootstrap_theme:columns"].columns': 1
      'div[data-component-id="oe_bootstrap_theme:columns"][style="--columns-grid--column-count: 3;"]': 1
      'div[data-component-id="oe_bootstrap_theme:columns"] > .columns__item': 6
columns_section_element:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:columns
    '#props':
      items:
        - '#plain_text': Column 1
        - '#plain_text': Column 2
        - '#plain_text': Column 3
        - '#plain_text': Column 4
        - '#plain_text': Column 5
        - '#plain_text': Column 6
      tag: section
      columns: 6
  assertions:
    count:
      'section[data-component-id="oe_bootstrap_theme:columns"].columns': 1
      'section[data-component-id="oe_bootstrap_theme:columns"][style="--columns-grid--column-count: 6;"]': 1
      'section[data-component-id="oe_bootstrap_theme:columns"] > .columns__item': 6
