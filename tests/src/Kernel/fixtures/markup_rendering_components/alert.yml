alert_dismissible_animated:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:alert
    '#props':
      variant: danger
      dismissible: true
      animated_dismiss: true
      heading: 'Well done!'
      message: 'A simple alert. check it out!'
      icon: lock
  assertions:
    count:
      'div.alert.alert-danger.alert-dismissible.fade[role="alert"]': 1
      'div.h4.alert-heading': 1
      'button.btn-close': 1
    equals:
      'div.h4.alert-heading': 'Well done!'
    contains:
      'div.alert-content': 'A simple alert. check it out!'
      'svg': '#lock'
alert_dismissible_non_animated:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:alert
    '#props':
      variant: info
      dismissible: true
      animated_dismiss: false
      heading: 'Well done!'
      message: 'A simple alert. check it out!'
      icon: lock
  assertions:
    count:
      'div.alert.alert-info.alert-dismissible[role="alert"]': 1
      'div.fade': 0
      'div.h4.alert-heading': 1
      'button.btn-close': 1
    equals:
      'div.h4.alert-heading': 'Well done!'
      'div.alert-content': '<div class="alert-heading h4">Well done!</div>A simple alert. check it out!'
    contains:
      'svg': '#lock'
alert_not_dismissible:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:alert
    '#props':
      variant: secondary
      dismissible: false
      animated_dismiss: false
      heading: 'Well done!'
      message: 'A simple alert. check it out!'
      icon: search
  assertions:
    count:
      'div.alert-dismissible': 0
      'button.btn-close': 0
      'div.alert-secondary': 1
      'div.h4.alert-heading': 1
    equals:
      'div.h4.alert-heading': 'Well done!'
      'div.alert-content': '<div class="alert-heading h4">Well done!</div>A simple alert. check it out!'
    contains:
      'svg': '#search'
