banner_image_with_copyright_overlay:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:banner
    '#props':
      variant: image
      hero: false
      full_width: false
      centered: false
      title: 'EU Budget for the future'
      description: 'Innovation, economy, environment and geopolitics'
      copyright: '© 2024 Example Organisation'
      image: 'https://picsum.photos/1000/500/'
  assertions:
    count:
      '.bcl-banner': 1
      'div.bcl-banner.bg-lighter.text-dark': 1
      'div.overlay': 1
      'div.shade': 0
      '.bcl-copyright': 1
      'div.bcl-banner__image[style="background-image:url(https://picsum.photos/1000/500/)"]': 1
