banner_with_custom_attributes_and_content_classes:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:banner
    '#props':
      variant: default
      attributes:
        class:
          - custom-banner-class
        id: banner-id
        data-banner-attribute: banner-attr-value
      title: 'EU Budget for the future'
      description: 'Innovation, economy, environment and geopolitics'
      content_classes: 'custom-content-class another-content-class'
  assertions:
    count:
      'div#banner-id': 1
      'div.custom-banner-class.bcl-banner.bg-lighter.text-dark': 1
      'div[data-banner-attribute="banner-attr-value"]': 1
      'div.bcl-banner__content.custom-content-class.another-content-class': 1
    contains:
      '.bcl-banner__content': 'EU Budget for the future'
