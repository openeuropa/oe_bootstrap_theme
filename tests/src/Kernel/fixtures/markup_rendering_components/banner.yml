banner_default_centered_with_call_to_action_full_width:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:banner
    '#props':
      variant: default
      hero: false
      full_width: true
      centered: true
      title: 'EU Budget for the future'
      title_tag: h4
      description: 'Innovation, economy, environment and geopolitics'
      call_to_action:
        label: Subscribe
        path: 'https://example.com'
  assertions:
    count:
      '.bcl-banner__content h4.bcl-heading': 1
      'div.bg-lighter.text-dark.bcl-banner': 1
      'div.full-width': 1
      'div.text-center': 1
      'div.bcl-banner__content': 1
      'a': 1
      'div.hero': 0
      'div.bcl-banner__image': 0
    contains:
      '.bcl-banner__content p': 'Innovation, economy, environment and geopolitics'
    equals:
      '.bcl-banner__content h4.bcl-heading': 'EU Budget for the future'
      '.bcl-banner__content a[href="https://example.com"]': Subscribe
banner_default_props_omitted:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:banner
    '#props':
      variant: default
