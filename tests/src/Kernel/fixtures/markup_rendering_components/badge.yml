badge_with_all_values:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:badge
    '#props':
      background: danger
      rounded_pill: true
      dismissible: true
      outline: true
      label: 'A simple badge!'
      url: 'https://example.com'
      title: 'The badge title'
  assertions:
    component:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\BadgePatternAssert
      expected:
        settings:
          background: danger
          rounded_pill: true
          dismissible: true
          outline: true
        label: 'A simple badge!'
        url: 'https://example.com'
        title: 'The badge title'
badge_no_settings_sent:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:badge
    '#props':
      label: 'A simple badge!'
      url: 'https://example.com'
      title: 'The badge title'
  assertions:
    component:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\BadgePatternAssert
      expected:
        settings:
          background: primary
          rounded_pill: false
          dismissible: false
          outline: false
        label: 'A simple badge!'
        url: 'https://example.com'
        title: 'The badge title'
