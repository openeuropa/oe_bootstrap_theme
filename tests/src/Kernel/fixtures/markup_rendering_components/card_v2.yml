card_v2_no_values:
  render:
    '#type': component
    '#component': oe_bootstrap_theme:card_v2
    '#props':
      variant: default
  assertions:
    component:
      class: Drupal\Tests\oe_bootstrap_theme\PatternAssertion\CardV2PatternAssert
      expected:
        variant: default
        tag: article
        title: ~
        media: ~
        content: ''
        footer: ~
        header: ~
        attributes:
          class: 'card v2'
