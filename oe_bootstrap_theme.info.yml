name: OpenEuropa Bootstrap Theme
description: OpenEuropa base theme using Bootstrap.
screenshot: screenshot.png
type: theme
base theme: false
core_version_requirement: ^10.3 || ^11

libraries:
  - oe_bootstrap_theme/bcl
  - oe_bootstrap_theme/style

libraries-override:
  system/admin:
    css:
      theme:
        css/system.admin.css: false

libraries-extend:
  core/drupal.progress:
    - oe_bootstrap_theme/drupal.progress

ckeditor_stylesheets:
  - assets/css/oe-bcl-default.min.css

ckeditor5-stylesheets:
  - assets/css/oe-bcl-ckeditor5.min.css

regions:
  navbar_branding: Navbar branding
  navbar_left: Navbar left
  navbar_right: Navbar right
  header: Header
  content: Content
  page_bottom: Page bottom
  footer: Footer

config_devel:
  install:
    - oe_bootstrap_theme.settings
  optional:
    - block.block.oe_bootstrap_theme_branding
    - block.block.oe_bootstrap_theme_breadcrumbs
    - block.block.oe_bootstrap_theme_local_actions
    - block.block.oe_bootstrap_theme_local_tasks
    - block.block.oe_bootstrap_theme_mainnavigation
    - block.block.oe_bootstrap_theme_messages
    - block.block.oe_bootstrap_theme_page_title
    - block.block.oe_bootstrap_theme_useraccountmenu
