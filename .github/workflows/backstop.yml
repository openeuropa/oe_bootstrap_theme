name: BackstopJS VRT

on:
  pull_request:

env:
  # Reused when uploading the generated Backstop HTML report.
  REPORT_DIR: tests/vrt/html_report
  CI: true

jobs:
  backstop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps
          npm run vrt:build

      - name: Run BackstopJS
        id: backstop
        run: |
          npm run vrt:test
        # Keep artifact uploads running even when Backstop finds visual diffs.
        continue-on-error: true

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Add the commit SHA so each workflow run gets a distinct artifact name.
          name: backstop-report-${{ github.sha }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn

      - name: Upload Backstop bitmaps (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Preserve test and reference screenshots to inspect failures after the run.
          name: backstop-bitmaps-${{ github.sha }}
          path: |
            tests/vrt/bitmaps_test
            tests/vrt/bitmaps_reference
          if-no-files-found: warn

      - name: Fail if Backstop failed
        # Fail the job only after the report and bitmaps have been uploaded.
        if: steps.backstop.outcome != 'success'
        run: exit 1
