name: Visual regression tests

on:
  pull_request:

jobs:
  vrt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Start Drupal stack
        run: docker compose up -d mysql web

      - name: Install Drupal
        run: |
          docker compose exec -T web composer install
          docker compose exec -T web ./vendor/bin/run drupal:site-install

      - name: Install Playwright browser and OS dependencies
        run: docker compose exec -T web pnpm run vrt:install

      - name: Run visual regression tests
        run: docker compose exec -T -e CI=true web pnpm run vrt:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The HTML report shows the expected, actual and diff images.
          name: vrt-report-${{ github.sha }}
          path: |
            tests/vrt/html_report
            tests/vrt/test-results
          if-no-files-found: warn

      - name: Stop Drupal stack
        if: always()
        run: docker compose down
