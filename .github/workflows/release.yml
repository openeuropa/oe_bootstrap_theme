name: Release artifacts
on:
  # Build artifacts when a release is published.
  release:
    types: [published]
  # Rebuild artifacts when a tag for a published release is updated.
  push:
    tags:
      - '*'

jobs:
  get-release-status:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.get_release_status.outputs.status }}
    steps:
      - uses: actions/checkout@v2
      - name: Get the release status
        id: get_release_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG_NAME=${{ github.event.release.tag_name || github.ref_name }}
          IS_DRAFT=$(gh release view --json isDraft --jq '.isDraft' $TAG_NAME 2>/dev/null) || true
          case "$IS_DRAFT" in
            "true") STATUS="draft" ;;
            "false") STATUS="public" ;;
            *) STATUS="missing" ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: get-release-status
    if: ${{ needs.get-release-status.outputs.status == 'public' }}
    strategy:
      matrix:
        php_version: ["8.3"]
        core_version: ["10.4.0"]
    env:
      PHP_VERSION: ${{ matrix.php_version }}
    steps:
      - name: "Set tag name ${{ github.event.release.tag_name || github.ref_name }}"
        # Make the tag name available in every step.
        run: |
          echo "TAG_NAME=${{ github.event.release.tag_name || github.ref_name }}" >> $GITHUB_ENV

      - name: Clone repository
        uses: actions/checkout@v2

      - name: Modify web container version
        run: |
          # Set the php version, and replace -dev with -ci.
          sed -i 's/httpd-php:8\.3-\(dev\|ci\)/httpd-php:${{ matrix.php_version}}-ci/g' docker-compose.yml
          # Report the difference.
          git diff

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Install zip
        run: |
          docker compose exec -T web apt-get update -y
          docker compose exec -T web apt-get install zip -y

      - name: Composer self-update
        run: docker compose exec -T web composer self-update --2

      - name: Composer install
        run: docker compose exec -T web composer require drupal/core:~${{ matrix.core_version }} drupal/core-composer-scaffold:~${{ matrix.core_version }} --update-with-all-dependencies --ansi --no-progress --no-interaction

      - name: Run grumphp
        run: docker compose exec -T web ./vendor/bin/grumphp run

      - name: Build assets with npm
        run: |
          docker compose exec -T web npm install --unsafe-perm
          docker compose exec -T -e NODE_ENV=production web npm run production

      - name: Create release archive
        # There are different ways to get the current tag.
        # We use only one, but report both.
        run: |
          git config --global --add safe.directory /test/oe_bootstrap_theme
          docker compose exec -T web ./vendor/bin/run release:create-archive --tag=$TAG_NAME
          docker compose exec -T web ./vendor/bin/run release:create-archive --tag=$TAG_NAME --zip

      - name: Upload release archive
        run: >
          gh release upload --clobber "${TAG_NAME}"
          "oe_bootstrap_theme-${TAG_NAME}.tar.gz"
          "oe_bootstrap_theme-${TAG_NAME}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
